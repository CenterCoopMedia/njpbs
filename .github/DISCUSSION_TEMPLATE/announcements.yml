title: "[Update] "
body:
  - type: markdown
    attributes:
      value: |
        Maintainers use this category for updates collaborators need to find later.

        Do not include passwords, Access codes, donor or member data, private contact details, unpublished agreements, or other protected information.
  - type: textarea
    id: summary
    attributes:
      label: What changed?
      description: Give the result first and use plain language.
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Who is affected?
      description: Staff editors, CCM collaborators, stakeholders, or viewers.
    validations:
      required: true
  - type: textarea
    id: action
    attributes:
      label: What action is needed?
      description: Write "No action" when this is for information only.
    validations:
      required: true
  - type: textarea
    id: proof
    attributes:
      label: Where can people verify the update?
      description: Safe links to the live site, a discussion, or a tracked issue.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I checked that this announcement and its links do not expose protected information.
          required: true
