version: 2
updates:
  # GitHub Actions used by CI. Grouped into one weekly PR so a batch of
  # action bumps doesn't open N parallel PRs that fight each other.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions-all:
        patterns: ["*"]
  # Keep the recovered billing lockfile pinned during the 48-hour switch watch.
  # Remove this block through the reviewed hash-refresh work in #100.
  - package-ecosystem: npm
    directory: /infrastructure/billing-kill-switch
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
    ignore:
      - dependency-name: "*"
