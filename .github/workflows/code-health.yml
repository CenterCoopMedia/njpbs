name: Code health

on:
  workflow_call:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: code-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-health:
    name: Code health report
    continue-on-error: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Metered-API source scan (before any scanned code runs)
        run: node candidate/.github/scripts/metered-api-scan.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          cache: npm
          package-manager-cache: true
          cache-dependency-path: |
            candidate/package-lock.json
            candidate/site/package-lock.json
      - name: Install report dependencies
        env:
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          QUEUE_BASE: ${{ github.event.merge_group.base_sha }}
        run: |
          base=
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              # The event's base SHA can lag the base of the tested merge commit.
              if [ "$(git -C candidate rev-parse HEAD^2)" != "$PR_HEAD" ]; then
                echo "The tested merge does not contain the event PR head."
                exit 1
              fi
              base=HEAD^1
              ;;
            merge_group)
              test -n "$QUEUE_BASE"
              git -C candidate fetch --no-tags --depth=1 origin "$QUEUE_BASE"
              base=$QUEUE_BASE
              ;;
          esac
          if [ -n "$base" ]; then
            git -C candidate worktree add --detach ../baseline "$base"
            npm --prefix baseline ci --ignore-scripts
            npm --prefix baseline/site ci --ignore-scripts
            npm --prefix baseline run functions:build --if-present
          fi
          npm --prefix candidate ci --ignore-scripts
          npm --prefix candidate/site ci --ignore-scripts
          npm --prefix candidate run functions:build --if-present
      - name: Measure lint, Functions types and size
        run: |
          baseline=()
          if [ -d baseline ]; then baseline=(baseline); fi
          node --test candidate/.github/scripts/report-code-health.test.mjs
          node candidate/.github/scripts/report-code-health.mjs "$RUNNER_TEMP/code-health" candidate "${baseline[@]}"
      - name: Save code health baselines and findings
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: code-health
          path: ${{ runner.temp }}/code-health

