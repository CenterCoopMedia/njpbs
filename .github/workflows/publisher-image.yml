name: Publisher image
# Production keeps the default title; a development run names its target and source.
# The release CLI's dispatch ID ends the title, so the CLI finds its run after a lost answer.
run-name: ${{ inputs.target == 'development' && format('Publisher image development {0}', inputs.sha) || 'Publisher image' }}${{ inputs.release_dispatch_id && format(' [{0}]', inputs.release_dispatch_id) || '' }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character main commit with successful source CI
        required: true
        type: string
      target:
        description: Publisher target
        required: false
        type: choice
        default: production
        options: [production, development]
      release_dispatch_id:
        description: Release CLI correlation ID
        required: false
        default: ""
        type: string

permissions:
  contents: read
  actions: read

# Serialize the SHA lookup and push so a rerun cannot replace its image.
concurrency:
  group: publisher-image-${{ inputs.target == 'development' && 'development-' || '' }}${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  image:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.CANONICAL_GITHUB_REPOSITORY != '' &&
      vars.CANONICAL_GITHUB_REPOSITORY_ID != '' &&
      github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID &&
      github.workflow_ref == format('{0}/.github/workflows/publisher-image.yml@refs/heads/main', vars.CANONICAL_GITHUB_REPOSITORY) &&
      vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER
    runs-on: ubuntu-24.04
    # Stops a hung image build; kept because it waits on the container build and push.
    # Measured 177 s, 44 s (reused image), 176 s (45162680868, 45127558717, dev 45256764191).
    timeout-minutes: 45
    environment: publisher-image
    env:
      SOURCE_SHA: ${{ inputs.sha }}
      PUBLISHER_TARGET: ${{ inputs.target }}
      CANONICAL_GITHUB_REPOSITORY: ${{ vars.CANONICAL_GITHUB_REPOSITORY }}
      CANONICAL_GITHUB_REPOSITORY_ID: ${{ vars.CANONICAL_GITHUB_REPOSITORY_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          path: workflow
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact main source and successful CI
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../workflow/.github/scripts/publisher-image.mjs verify
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22.23.5"
          cache: npm
          package-manager-cache: true
          cache-dependency-path: |
            source/package-lock.json
            source/publisher/package-lock.json
      - name: Install locked dependencies
        working-directory: source
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Prepare exact source and target configuration
        working-directory: source
        env:
          PUBLISHER_PUBLIC_VARS_JSON: ${{ inputs.target == 'development' && vars.PUBLISHER_DEVELOPMENT_PUBLIC_VARS_JSON || vars.PUBLISHER_PUBLIC_VARS_JSON }}
          CMS_PRODUCTION_API_ORIGIN: ${{ vars.CMS_PRODUCTION_API_ORIGIN }}
          CMS_LOCAL_PUBLICATION_OWNER: ${{ vars.CMS_LOCAL_PUBLICATION_OWNER }}
          CMS_GPU_WORKER_ID: ${{ vars.CMS_GPU_WORKER_ID }}
          # Production renders only its three inputs; development renders all of them.
          CLOUDFLARE_DEV_PUBLIC_WORKER: ${{ vars.CLOUDFLARE_DEV_PUBLIC_WORKER }}
          CMS_DEV_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.target == 'development' && vars.CMS_DEV_CLOUDFLARE_ACCOUNT_ID || '' }}
          CMS_DEV_ADMIN_ORIGIN: ${{ vars.CMS_DEV_ADMIN_ORIGIN }}
          CMS_DEV_ADMIN_PAGES: ${{ vars.CMS_DEV_ADMIN_PAGES }}
          CMS_DEV_API_ORIGIN: ${{ vars.CMS_DEV_API_ORIGIN }}
          CMS_DEV_API_WORKER: ${{ vars.CMS_DEV_API_WORKER }}
          CMS_DEV_MEDIA_BUCKET: ${{ vars.CMS_DEV_MEDIA_BUCKET }}
          CMS_DEV_MEDIA_ORIGIN: ${{ vars.CMS_DEV_MEDIA_ORIGIN }}
          CMS_DEV_PREVIEW_BUCKET: ${{ vars.CMS_DEV_PREVIEW_BUCKET }}
          CMS_DEV_PREVIEW_ORIGIN: ${{ vars.CMS_DEV_PREVIEW_ORIGIN }}
          CMS_DEV_PREVIEW_RENDERER: ${{ vars.CMS_DEV_PREVIEW_RENDERER }}
          CMS_DEV_PREVIEW_STAFF_WORKER: ${{ vars.CMS_DEV_PREVIEW_STAFF_WORKER }}
          CMS_DEV_PREVIEW_WORKER: ${{ vars.CMS_DEV_PREVIEW_WORKER }}
          CMS_DEV_PUBLIC_ORIGIN: ${{ vars.CMS_DEV_PUBLIC_ORIGIN }}
          CMS_DEV_SITE_PAGES: ${{ vars.CMS_DEV_SITE_PAGES }}
        run: node ../workflow/.github/scripts/publisher-image.mjs prepare
      - name: Reuse or build and push the SHA image
        working-directory: source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLISHER_IMAGE_TOKEN }}
        run: node ../workflow/.github/scripts/publisher-image.mjs image
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: publisher-image-${{ inputs.target == 'development' && 'development-' || '' }}${{ inputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-image-receipt/
          if-no-files-found: error
          retention-days: 30
