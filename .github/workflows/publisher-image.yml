name: Publisher image

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Exact 40-character main commit with successful source CI
        required: true
        type: string

permissions:
  contents: read
  actions: read

# Serialize the SHA lookup and push so a rerun cannot replace its image.
concurrency:
  group: publisher-image-${{ inputs.sha }}
  cancel-in-progress: false

jobs:
  image:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: publisher-image
    env:
      SOURCE_SHA: ${{ inputs.sha }}
      CANONICAL_GITHUB_REPOSITORY: ${{ vars.CANONICAL_GITHUB_REPOSITORY }}
      CANONICAL_GITHUB_REPOSITORY_ID: ${{ vars.CANONICAL_GITHUB_REPOSITORY_ID }}
      WRANGLER_SEND_METRICS: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: workflow
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.sha }}
          path: source
          fetch-depth: 0
          persist-credentials: false
      - name: Require exact main source and successful CI
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: node ../workflow/.github/scripts/publisher-image.mjs verify
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          cache: npm
          package-manager-cache: true
          cache-dependency-path: |
            source/package-lock.json
            source/publisher/package-lock.json
      - name: Install locked dependencies
        working-directory: source
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Prepare exact source and production configuration
        working-directory: source
        env:
          PUBLISHER_PUBLIC_VARS_JSON: ${{ vars.PUBLISHER_PUBLIC_VARS_JSON }}
          CMS_PRODUCTION_API_ORIGIN: ${{ vars.CMS_PRODUCTION_API_ORIGIN }}
          CMS_LOCAL_PUBLICATION_OWNER: ${{ vars.CMS_LOCAL_PUBLICATION_OWNER }}
          CMS_GPU_WORKER_ID: ${{ vars.CMS_GPU_WORKER_ID }}
        run: node ../workflow/.github/scripts/publisher-image.mjs prepare
      - name: Reuse or build and push the SHA image
        working-directory: source
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_PUBLISHER_IMAGE_TOKEN }}
        run: node ../workflow/.github/scripts/publisher-image.mjs image
      - uses: actions/upload-artifact@v7
        with:
          name: publisher-image-${{ inputs.sha }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/publisher-image-receipt/
          if-no-files-found: error
          retention-days: 30
