name: Shadow Posts dev deploy

on:
  workflow_dispatch:
    inputs:
      enabled:
        description: "Enable the one-Post dev pilot after staff admission checks"
        type: boolean
        default: false
      remove:
        description: "Remove the dev shadow route and both shadow Workers"
        type: boolean
        default: false

permissions:
  contents: read

env:
  CLOUDFLARE_DEV_PUBLIC_WORKER: ${{ vars.CLOUDFLARE_DEV_PUBLIC_WORKER }}
  CMS_DEV_ADMIN_ORIGIN: ${{ vars.CMS_DEV_ADMIN_ORIGIN }}
  CMS_DEV_ADMIN_PAGES: ${{ vars.CMS_DEV_ADMIN_PAGES }}
  CMS_DEV_API_ORIGIN: ${{ vars.CMS_DEV_API_ORIGIN }}
  CMS_DEV_API_WORKER: ${{ vars.CMS_DEV_API_WORKER }}
  CMS_DEV_MEDIA_BUCKET: ${{ vars.CMS_DEV_MEDIA_BUCKET }}
  CMS_DEV_MEDIA_ORIGIN: ${{ vars.CMS_DEV_MEDIA_ORIGIN }}
  CMS_DEV_PREVIEW_BUCKET: ${{ vars.CMS_DEV_PREVIEW_BUCKET }}
  CMS_DEV_PREVIEW_ORIGIN: ${{ vars.CMS_DEV_PREVIEW_ORIGIN }}
  CMS_DEV_PREVIEW_RENDERER: ${{ vars.CMS_DEV_PREVIEW_RENDERER }}
  CMS_DEV_PREVIEW_STAFF_WORKER: ${{ vars.CMS_DEV_PREVIEW_STAFF_WORKER }}
  CMS_DEV_PREVIEW_WORKER: ${{ vars.CMS_DEV_PREVIEW_WORKER }}
  CMS_DEV_PUBLIC_ORIGIN: ${{ vars.CMS_DEV_PUBLIC_ORIGIN }}
  CMS_DEV_SITE_PAGES: ${{ vars.CMS_DEV_SITE_PAGES }}
  CMS_PRODUCTION_API_ORIGIN: ${{ vars.CMS_PRODUCTION_API_ORIGIN }}
  CMS_DEPLOY_OWNER: ${{ vars.CMS_DEPLOY_OWNER }}
  CMS_DEV_ACCESS_ORIGIN: ${{ vars.CMS_DEV_ACCESS_ORIGIN }}

concurrency:
  group: shadow-posts-dev-deploy
  cancel-in-progress: false

jobs:
  deploy:
    environment: production
    # Repeat the CMS actor/ref guard so collaborator re-runs cannot deploy.
    if: (vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER) && github.ref == 'refs/heads/main'
    # Deploy credentials must not share PR slots or their writable disk.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Metered-API source scan (before any scanned code runs)
        run: node .github/scripts/metered-api-scan.mjs
      - name: Check out trusted configuration renderer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .configuration-render-gate
          persist-credentials: false
          sparse-checkout: |
            scripts/render-development-config.mjs
            config/development-inputs.json
          sparse-checkout-cone-mode: false
      - name: Render deployment resource configuration
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mv .configuration-render-gate "$RUNNER_TEMP/configuration-render-gate"
          node "$RUNNER_TEMP/configuration-render-gate/scripts/render-development-config.mjs" --root "$GITHUB_WORKSPACE"
      - name: Validate development Access origin
        run: node --input-type=module -e "import { devAccessOrigin } from './scripts/lib/deployment-settings.mjs'; devAccessOrigin();"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install workspace deps
        run: npm ci --ignore-scripts
      - name: Verify configured dev shadow route admission
        if: ${{ !inputs.remove }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_DEV_PUBLISH_ENABLED: ${{ vars.CMS_DEV_PUBLISH_ENABLED }}
        run: node scripts/manage-shadow-post-route.mjs check
      - name: Install shadow renderer deps
        if: ${{ !inputs.remove }}
        run: npm --prefix site ci --ignore-scripts
      - name: Build matched shadow renderer and assets
        if: ${{ !inputs.remove }}
        run: npm --prefix site run build:shadow
      - name: Require the matching reader secret
        if: ${{ !inputs.remove }}
        env:
          PUBLISHED_POST_READER_HMAC_KEY: ${{ secrets.PUBLISHED_POST_READER_HMAC_KEY }}
        run: |
          set -euo pipefail
          if [ "${#PUBLISHED_POST_READER_HMAC_KEY}" -lt 32 ]; then
            echo "::error::PUBLISHED_POST_READER_HMAC_KEY must contain at least 32 characters."
            exit 1
          fi
      - name: Deploy the private published Post relay
        if: ${{ !inputs.remove }}
        env:
          PUBLISHED_POST_FUNCTION_URL: ${{ vars.SHADOW_PUBLISHED_POST_FUNCTION_URL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          : "${PUBLISHED_POST_FUNCTION_URL:?Configure the published Post relay endpoint}"
          node --input-type=module -e '
            let url;
            try { url = new URL(process.env.PUBLISHED_POST_FUNCTION_URL); } catch { process.exit(1); }
            if (url.protocol !== "https:" || url.port || url.username || url.password || url.search || url.hash ||
                !/^[a-z0-9-]+\.cloudfunctions\.net$/.test(url.hostname) || url.pathname !== "/cmsGetPublishedPost") process.exit(1);
          '
          npx --no-install wrangler deploy --config workers/wrangler.published-post-reader.jsonc \
            --var "PUBLISHED_POST_FUNCTION_URL:$PUBLISHED_POST_FUNCTION_URL"
      - name: Put the shadow reader secret through stdin
        if: ${{ !inputs.remove }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PUBLISHED_POST_READER_HMAC_KEY: ${{ secrets.PUBLISHED_POST_READER_HMAC_KEY }}
        run: |
          set -euo pipefail
          printf '%s' "$PUBLISHED_POST_READER_HMAC_KEY" | \
            npx --no-install wrangler secret put PUBLISHED_POST_READER_HMAC_KEY \
              --config workers/wrangler.shadow-posts.jsonc
      - name: Deploy the dev shadow Post Worker
        if: ${{ !inputs.remove }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          SHADOW_POSTS_ENABLED: ${{ inputs.enabled && 'true' || 'false' }}
          SHADOW_POST_SLUGS: ${{ inputs.enabled && 'nj-pbs-announces-six-staff-appointments' || '' }}
        run: |
          set -euo pipefail
          rendered="$(node scripts/render-wrangler-config.mjs --config workers/wrangler.shadow-posts.jsonc)"
          trap 'rm -f "$rendered"' EXIT
          npx --no-install wrangler deploy --config "$rendered" \
            --var "SHADOW_POSTS_ENABLED:$SHADOW_POSTS_ENABLED" \
            --var "SHADOW_POST_SLUGS:$SHADOW_POST_SLUGS"
      - name: Remove and verify the configured dev shadow route
        if: ${{ inputs.remove }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node scripts/manage-shadow-post-route.mjs remove
      - name: Remove the dev shadow Workers
        if: ${{ inputs.remove }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          # The preceding step removes the route. Delete the caller before its relay.
          # An already absent Worker counts as removed, so a partial failure can be retried.
          delete_worker() {
            local config="$1" name status
            name="$(node -e 'const fs=require("fs");const t=fs.readFileSync(process.argv[1],"utf8").replace(/^\s*\/\/.*$/gm,"");console.log(JSON.parse(t).name)' "$config")"
            status="$(curl --disable --silent --show-error --max-time 30 --output /dev/null --write-out '%{http_code}' \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$name")"
            case "$status" in
              200) npx --no-install wrangler delete --config "$config" ;;
              404) echo "$name is already absent" ;;
              *) echo "Could not read $name state (HTTP $status)" >&2; return 1 ;;
            esac
          }
          delete_worker workers/wrangler.shadow-posts.jsonc
          delete_worker workers/wrangler.published-post-reader.jsonc
      - name: Verify signed-out staff admission
        run: node scripts/check-shadow-signed-out.mjs
