name: CMS staging deploy
run-name: ${{ inputs.release_dispatch_id && format('CMS staging deploy [{0}]', inputs.release_dispatch_id) || 'CMS staging deploy' }}

# Manual deploy wiring for the CMS staging package. This workflow can deploy the
# Firebase backend and the admin front. Every job refuses a run whose workflow
# definition does not come from the protected default branch.
on:
  workflow_dispatch:
    inputs:
      emergency_release:
        description: "Coordinator-authorized freeze fix from recorded live source"
        required: false
        default: false
        type: boolean
      emergency_authorization:
        description: "<EMERGENCY|CRITICAL> <exact SHA> FROM <live base SHA> #<issue>: <reason>"
        required: false
        default: ""
        type: string
      deploy_ref:
        description: "Explicit full reviewed NEW commit SHA to deploy"
        required: true
        type: string
      target:
        description: "CMS to deploy: the production CMS or the dev CMS"
        required: false
        default: production
        type: choice
        options:
          - production
          - development
      release_dispatch_id:
        description: "Optional release CLI correlation ID for a deploy with default settings"
        required: false
        default: ""
        type: string
      cloudflare_pages_branch:
        description: "Cloudflare Pages branch label"
        required: false
        default: main
        type: string
      force_firebase:
        description: "Force the paired Functions and renderer release"
        required: false
        default: false
        type: boolean

      migrations:
        description: "Optional comma-separated repair keys from MIGRATION_INPUTS; does not force a Functions release"
        required: false
        default: ""
        type: string

      install_reader_bridge:
        description: "Separately authorized production first reader deployment (requires force_firebase and exact workflow source)"
        required: false
        default: false
        type: boolean
      reader_operation_id:
        description: "Frozen original reader-... operation; never reuse after an uncertain deployment"
        required: false
        default: ""
        type: string
      reader_install_authorization:
        description: "Explicit coordinator authorization: INSTALL_PRODUCTION_READERS"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: ${{ inputs.target == 'development' && 'cms-staging-deploy-development' || 'cms-staging-deploy' }}
  cancel-in-progress: false


env:
  CMS_PUBLISH_TRANSPORT: serializer
  CMS_PRODUCTION_API_ORIGIN: ${{ vars.CMS_PRODUCTION_API_ORIGIN }}
  CMS_LOCAL_PUBLICATION_OWNER: ${{ vars.CMS_LOCAL_PUBLICATION_OWNER }}
  CMS_GPU_WORKER_ID: ${{ vars.CMS_GPU_WORKER_ID }}
  CANONICAL_GITHUB_REPOSITORY: ${{ vars.CANONICAL_GITHUB_REPOSITORY }}
  CANONICAL_GITHUB_REPOSITORY_ID: ${{ vars.CANONICAL_GITHUB_REPOSITORY_ID }}
  VITE_CANONICAL_GITHUB_REPOSITORY: ${{ vars.CANONICAL_GITHUB_REPOSITORY }}
  # Target record. The target input selects the GitHub environment (credentials
  # and settings under the production names) and every system named below.
  # Production evaluates to the values this workflow has always used. Names stay
  # literal: repository variables hold production values, so a dev run must never
  # fall back to one.
  # A development-environment job falls back to the repository (production) value of a
  # secret or variable the environment lacks (CenterCoopMedia/njpbs#562). These are the
  # names a development run needs from the development environment itself; the jawn-ops
  # release runner reads this JSON before a development dispatch and refuses any name the
  # environment lacks. tests/preflight/cms-deploy-workflow-parity.test.js keeps it equal
  # to the workflow's reads and names the variables shared on purpose.
  CMS_DEVELOPMENT_ENVIRONMENT_NAMES: >-
    {"secrets": ["CLOUDFLARE_ACCOUNT_ID", "CLOUDFLARE_API_TOKEN", "CMS_BUG_REPORT_GITHUB_TOKEN", "CMS_BUG_REPORT_GITHUB_WEBHOOK_SECRET", "CMS_BUG_REPORT_TELEGRAM_ADMIN_MAP", "CMS_BUG_REPORT_TELEGRAM_BOT_TOKEN", "CMS_BUG_REPORT_TELEGRAM_CHAT_ID", "CMS_BUG_REPORT_TELEGRAM_WEBHOOK_SECRET", "CMS_DEV_ACCESS_CLIENT_ID", "CMS_DEV_ACCESS_CLIENT_SECRET", "CMS_EDGE_ORIGIN_SECRET", "CMS_MEDIA_CACHE_PURGE_TOKEN", "CMS_PREVIEW_R2_CREDENTIAL", "CMS_PREVIEW_SMOKE_CREDENTIAL", "CMS_STAFF_EMAIL_API_TOKEN", "CMS_VOICEOVER_R2_ACCESS_KEY_ID", "CMS_VOICEOVER_R2_SECRET_ACCESS_KEY", "FIREBASE_SERVICE_ACCOUNT"], "variables": ["CMS_DEV_RENDERER_SOURCE_SHA", "CMS_PREVIEW_SMOKE_TARGET", "FIREBASE_DEPLOY_SERVICE_ACCOUNT", "VITE_FIREBASE_API_KEY", "VITE_FIREBASE_APPCHECK_SITE_KEY", "VITE_FIREBASE_APP_ID", "VITE_FIREBASE_AUTH_DOMAIN", "VITE_FIREBASE_PROJECT_ID", "VITE_FUNCTIONS_BASE_URL"]}
  CMS_TARGET: ${{ inputs.target == 'development' && 'development' || 'production' }}
  CMS_TARGET_FIREBASE_PROJECT: ${{ inputs.target == 'development' && 'njpbs-site-dev' || 'njpbs-site' }}
  CMS_TARGET_ADMIN_ORIGIN: ${{ inputs.target == 'development' && 'https://dev-admin.njpbs.org' || 'https://admin.njpbs.org' }}
  CMS_TARGET_API_ORIGIN: ${{ inputs.target == 'development' && 'https://dev-cms-api.njpbs.org' || vars.CMS_PRODUCTION_API_ORIGIN }}
  CMS_TARGET_PUBLIC_ORIGIN: ${{ inputs.target == 'development' && 'https://dev.njpbs.org' || 'https://njpbs.org' }}
  CMS_TARGET_MEDIA_ORIGIN: ${{ inputs.target == 'development' && 'https://dev-media.njpbs.org' || 'https://media.njpbs.org' }}
  CMS_TARGET_MEDIA_BUCKET: ${{ inputs.target == 'development' && 'njpbs-dev-media' || vars.CMS_MEDIA_R2_BUCKET }}
  CMS_TARGET_ADMIN_PAGES: ${{ inputs.target == 'development' && 'njpbs-dev-admin' || 'njpbs-admin' }}
  CMS_TARGET_RENDER_SCOPE: ${{ inputs.target == 'development' && '--development' || '--production' }}
  CMS_TARGET_FIREBASE_CONFIG: ${{ inputs.target == 'development' && 'firebase.dev.json' || 'firebase.json' }}
  # The dev project has no Firebase Storage rules.
  CMS_TARGET_FIREBASE_RULES: ${{ inputs.target == 'development' && 'firestore:rules,firestore:indexes' || 'firestore:rules,firestore:indexes,storage' }}
  # The dev run deploys the CMS against the renderer cms-dev-deploy.yml installed and pinned.
  CMS_TARGET_RENDERER_SHA: ${{ inputs.target == 'development' && vars.CMS_DEV_RENDERER_SOURCE_SHA || '' }}
  # The dev render writes these names into the dev configs; production renders none of them.
  CLOUDFLARE_DEV_PUBLIC_WORKER: ${{ inputs.target == 'development' && vars.CLOUDFLARE_DEV_PUBLIC_WORKER || '' }}
  CMS_DEV_ADMIN_ORIGIN: ${{ inputs.target == 'development' && vars.CMS_DEV_ADMIN_ORIGIN || '' }}
  CMS_DEV_ADMIN_PAGES: ${{ inputs.target == 'development' && vars.CMS_DEV_ADMIN_PAGES || '' }}
  CMS_DEV_API_ORIGIN: ${{ inputs.target == 'development' && vars.CMS_DEV_API_ORIGIN || '' }}
  CMS_DEV_API_WORKER: ${{ inputs.target == 'development' && vars.CMS_DEV_API_WORKER || '' }}
  CMS_DEV_MEDIA_BUCKET: ${{ inputs.target == 'development' && vars.CMS_DEV_MEDIA_BUCKET || '' }}
  CMS_DEV_MEDIA_ORIGIN: ${{ inputs.target == 'development' && vars.CMS_DEV_MEDIA_ORIGIN || '' }}
  CMS_DEV_PREVIEW_BUCKET: ${{ inputs.target == 'development' && vars.CMS_DEV_PREVIEW_BUCKET || '' }}
  CMS_DEV_PREVIEW_ORIGIN: ${{ inputs.target == 'development' && vars.CMS_DEV_PREVIEW_ORIGIN || '' }}
  CMS_DEV_PREVIEW_RENDERER: ${{ inputs.target == 'development' && vars.CMS_DEV_PREVIEW_RENDERER || '' }}
  CMS_DEV_PREVIEW_STAFF_WORKER: ${{ inputs.target == 'development' && vars.CMS_DEV_PREVIEW_STAFF_WORKER || '' }}
  CMS_DEV_PREVIEW_WORKER: ${{ inputs.target == 'development' && vars.CMS_DEV_PREVIEW_WORKER || '' }}
  CMS_DEV_PUBLIC_ORIGIN: ${{ inputs.target == 'development' && vars.CMS_DEV_PUBLIC_ORIGIN || '' }}
  CMS_DEV_SITE_PAGES: ${{ inputs.target == 'development' && vars.CMS_DEV_SITE_PAGES || '' }}
  CMS_DEV_ACCESS_ORIGIN: ${{ inputs.target == 'development' && vars.CMS_DEV_ACCESS_ORIGIN || '' }}

jobs:
  admin-build:
    env:
      CMS_DEPLOY_OWNER: ${{ vars.CMS_DEPLOY_OWNER }}
    environment: ${{ inputs.target == 'development' && 'development' || 'production' }}
    # Use triggering_actor rather than actor so a collaborator cannot re-run a
    # deployment started by the owner. Repeat the check on every job because a partial
    # re-run does not re-evaluate jobs that already succeeded.
    if: >-
      (vars.CANONICAL_GITHUB_REPOSITORY != '' && vars.CANONICAL_GITHUB_REPOSITORY_ID != '' && github.repository == vars.CANONICAL_GITHUB_REPOSITORY && github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID) &&
      (vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER) && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      issues: read
      actions: read
    outputs:
      deploy_sha: ${{ steps.reviewed_ref.outputs.deploy_sha }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # Runaway guard: 3x max rounds to 19m; retain 20m floor (#2657).
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.deploy_ref }}
          fetch-depth: 0
          persist-credentials: true
      - name: Check out trusted release source gate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-gate
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Isolate trusted release-gate checkout
        run: |
          set -euo pipefail
          mv .release-gate "$RUNNER_TEMP/release-gate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/release-gate/node_modules"
      - name: Require reviewed deploy ref
        id: reviewed_ref
        env:
          EMERGENCY_RELEASE: ${{ inputs.emergency_release || false }}
          EMERGENCY_AUTHORIZATION: ${{ inputs.emergency_authorization || '' }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          node "$RUNNER_TEMP/release-gate"/.github/scripts/require-release-source.mjs
      - name: Check out current Admin status gate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .admin-status-gate
          persist-credentials: false
      - name: Isolate trusted admin-status-gate checkout
        run: |
          set -euo pipefail
          mv .admin-status-gate "$RUNNER_TEMP/admin-status-gate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/admin-status-gate/node_modules"
      - name: Require pinned release and trusted workflow identities
        env:
          CMS_RELEASE_CHECKS_SHA: ${{ inputs.deploy_ref }}
          CMS_TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
          CMS_CORRELATED_DISPATCH_INPUTS: ${{ inputs.release_dispatch_id && toJSON(inputs) || '' }}
        run: node "$RUNNER_TEMP/release-gate"/.github/scripts/require-cms-release-sources.mjs
      - name: Retain separate release and trusted workflow identities
        uses: actions/upload-artifact@v7
        with:
          name: cms-release-source-identities
          path: ${{ runner.temp }}/cms-release-sources.json
          if-no-files-found: error
      - name: Require the target's deploy credentials
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CMS_ADMIN_ACCESS_API_TOKEN: ${{ inputs.target != 'development' && secrets.CMS_ADMIN_ACCESS_API_TOKEN || '' }}
          CMS_EDGE_ORIGIN_SECRET: ${{ secrets.CMS_EDGE_ORIGIN_SECRET }}
          CMS_PREVIEW_R2_CREDENTIAL: ${{ secrets.CMS_PREVIEW_R2_CREDENTIAL }}
          CMS_PREVIEW_SMOKE_CREDENTIAL: ${{ secrets.CMS_PREVIEW_SMOKE_CREDENTIAL }}
          CMS_DEV_ACCESS_CLIENT_ID: ${{ inputs.target == 'development' && secrets.CMS_DEV_ACCESS_CLIENT_ID || '' }}
          CMS_DEV_ACCESS_CLIENT_SECRET: ${{ inputs.target == 'development' && secrets.CMS_DEV_ACCESS_CLIENT_SECRET || '' }}
        run: |
          set -euo pipefail
          missing=()
          # The dev Admin stays behind Access and never opens the public authentication shell.
          names=(FIREBASE_SERVICE_ACCOUNT CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_API_TOKEN CMS_EDGE_ORIGIN_SECRET CMS_PREVIEW_R2_CREDENTIAL CMS_PREVIEW_SMOKE_CREDENTIAL)
          if [ "$CMS_TARGET" = development ]; then names+=(CMS_DEV_ACCESS_CLIENT_ID CMS_DEV_ACCESS_CLIENT_SECRET); else names+=(CMS_ADMIN_ACCESS_API_TOKEN); fi
          for name in "${names[@]}"; do
            if [ -z "${!name//[[:space:]]/}" ]; then missing+=("$name"); fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "The $CMS_TARGET environment is missing deploy secrets: ${missing[*]}" >&2
            exit 1
          fi
      - name: Record the production steps a development run skips
        if: inputs.target == 'development'
        run: |
          {
            echo "### Production steps this development run skips"
            echo "- Preview renderer pause, deploy, receipts and Containers probe: not rehearsed on dev; cms-dev-deploy.yml still writes the dev renderer (jawn-ops#1188)."
            echo "- Admin public authentication shell: the dev Admin stays behind Access. Dev counterpart: the anonymous-refusal proof in live-smoke."
            echo "- Signed-out Admin boot check: the dev Admin answers with the Access login. Dev counterpart: the anonymous-refusal proof in live-smoke."
            echo "- Private guide boundary checks: they read the production guide bucket and host."
            echo "- Studio connector package: dev has no private master-media bucket."
            echo "- Contract settlement: dev publication is held (CMS_DEV_PUBLISH_ENABLED=false)."
            echo "- Voiceover upload: the dev voiceover keys are placeholders; not rehearsed on dev."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Metered-API source scan (before any scanned code runs)
        run: node "$RUNNER_TEMP/admin-status-gate"/.github/scripts/metered-api-scan.mjs --target-root "$GITHUB_WORKSPACE"
      - name: Check out trusted configuration renderer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .configuration-render-gate
          persist-credentials: false
          sparse-checkout: |
            scripts/render-development-config.mjs
            config/development-inputs.json
          sparse-checkout-cone-mode: false
      - name: Render deployment resource configuration
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mv .configuration-render-gate "$RUNNER_TEMP/configuration-render-gate"
          node "$RUNNER_TEMP/configuration-render-gate/scripts/render-development-config.mjs" "${CMS_TARGET_RENDER_SCOPE:?}" --root "$GITHUB_WORKSPACE"
      - name: Metered-API source scan for current Admin status gate
        working-directory: ${{ runner.temp }}/admin-status-gate
        run: node .github/scripts/metered-api-scan.mjs
      - name: Validate the separate production reader installation authorization
        if: inputs.install_reader_bridge || inputs.reader_operation_id != '' || inputs.reader_install_authorization != ''
        env:
          CMS_PRODUCTION_INSTALL_READER_BRIDGE: ${{ inputs.install_reader_bridge }}
          CMS_PRODUCTION_READER_OPERATION_ID: ${{ inputs.reader_operation_id }}
          CMS_PRODUCTION_READER_INSTALL_AUTHORIZATION: ${{ inputs.reader_install_authorization }}
          CMS_DEPLOYMENT_ENVIRONMENT: ${{ env.CMS_TARGET }}
          FIREBASE_PROJECT_ID: ${{ env.CMS_TARGET_FIREBASE_PROJECT }}
          FORCE_FIREBASE: ${{ inputs.force_firebase }}
          DEPLOY_SHA: ${{ steps.reviewed_ref.outputs.deploy_sha }}
        run: node --input-type=module -e 'const { productionReaderBinding } = await import((await import("node:url")).pathToFileURL(process.env.RUNNER_TEMP + "/admin-status-gate/scripts/lib/production-reader-authorization.mjs").href); productionReaderBinding();'
      - name: Require successful CI for the exact deploy SHA
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ steps.reviewed_ref.outputs.deploy_sha }}
          EMERGENCY_RELEASE: ${{ inputs.emergency_release || false }}
          EMERGENCY_AUTHORIZATION: ${{ inputs.emergency_authorization || '' }}
        run: node "$RUNNER_TEMP/admin-status-gate"/.github/scripts/require-main-ci.mjs
      - name: Require CMS deploy compatibility floor
        env:
          CMS_DEV_ACCESS_CLIENT_ID: ${{ inputs.target == 'development' && secrets.CMS_DEV_ACCESS_CLIENT_ID || '' }}
          CMS_DEV_ACCESS_CLIENT_SECRET: ${{ inputs.target == 'development' && secrets.CMS_DEV_ACCESS_CLIENT_SECRET || '' }}
        run: node "$RUNNER_TEMP/admin-status-gate"/.github/scripts/cms-deploy-compatibility.mjs --target-root "$GITHUB_WORKSPACE" --publisher-receipt-url "$CMS_TARGET_PUBLIC_ORIGIN/_publication.json"
      - name: Remove checkout credential before build tools
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          if git config --local --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo "Checkout credential remained in local Git configuration" >&2
            exit 1
          fi
          if git -C "$RUNNER_TEMP/admin-status-gate" config --local --get-regexp '^http\..*\.extraheader$' >/dev/null; then
            echo "Admin status gate checkout retained a credential" >&2
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          package-manager-cache: false
      - name: Require the signed-in preview smoke inputs before deployment
        env:
          CMS_PREVIEW_SMOKE_CREDENTIAL: ${{ secrets.CMS_PREVIEW_SMOKE_CREDENTIAL }}
          CMS_PREVIEW_SMOKE_TARGET: ${{ vars.CMS_PREVIEW_SMOKE_TARGET }}
        run: node "$RUNNER_TEMP/admin-status-gate"/scripts/smoke-signed-in-preview.mjs "$CMS_TARGET" --check-config
      - name: Install workspace deps
        run: npm ci --ignore-scripts
      - name: Preflight admin env
        env:
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || inputs.target != 'development' && secrets.VITE_FIREBASE_API_KEY || '' }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || inputs.target != 'development' && secrets.VITE_FIREBASE_APP_ID || '' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || inputs.target != 'development' && secrets.VITE_FIREBASE_AUTH_DOMAIN || '' }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || inputs.target != 'development' && secrets.VITE_FIREBASE_PROJECT_ID || '' }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY || inputs.target != 'development' && secrets.VITE_FIREBASE_APPCHECK_SITE_KEY || '' }}
          VITE_FUNCTIONS_BASE_URL: ${{ vars.VITE_FUNCTIONS_BASE_URL || inputs.target != 'development' && secrets.VITE_FUNCTIONS_BASE_URL || '' }}
        run: |
          set -euo pipefail
          missing=()
          for name in \
            VITE_FIREBASE_API_KEY \
            VITE_FIREBASE_APP_ID \
            VITE_FIREBASE_AUTH_DOMAIN \
            VITE_FIREBASE_PROJECT_ID \
            VITE_FIREBASE_APPCHECK_SITE_KEY \
            VITE_FUNCTIONS_BASE_URL
          do
            value="${!name:-}"
            if [ -z "${value//[[:space:]]/}" ]; then
              missing+=("$name")
            fi
          done

          if [ "${#missing[@]}" -gt 0 ]; then
            echo "Missing required admin build env vars:" >&2
            printf ' - %s\n' "${missing[@]}" >&2
            exit 1
          fi
          if [ "$VITE_FUNCTIONS_BASE_URL" != "${CMS_TARGET_API_ORIGIN:-}" ]; then
            echo "VITE_FUNCTIONS_BASE_URL must match the $CMS_TARGET API origin" >&2
            exit 1
          fi
          # Repository variables hold production values; the dev environment must override each.
          if [ "$VITE_FIREBASE_PROJECT_ID" != "$CMS_TARGET_FIREBASE_PROJECT" ] \
            || [ "$VITE_FIREBASE_AUTH_DOMAIN" != "$CMS_TARGET_FIREBASE_PROJECT.firebaseapp.com" ]; then
            echo "VITE_FIREBASE_PROJECT_ID and VITE_FIREBASE_AUTH_DOMAIN must name the $CMS_TARGET Firebase project" >&2
            exit 1
          fi
      - name: Require exact-draft preview readiness
        # This is intentionally an all-or-nothing contract for the full-stack
        # admin deploy. After exact preview is enabled, these values are standing
        # environment assertions rather than optional per-run feature flags.
        # Restore an older behavior by reverting on main and reviewing that new
        # commit; do not bypass a missing Access or terminal-writeback boundary.
        env:
          VITE_CMS_PREVIEW_ENABLED: ${{ vars.VITE_CMS_PREVIEW_ENABLED || 'false' }}
          CMS_PREVIEW_ACCESS_VERIFIED: ${{ vars.CMS_PREVIEW_ACCESS_VERIFIED || 'false' }}
          CMS_PREVIEW_TRANSPORT: ${{ vars.CMS_PREVIEW_TRANSPORT || 'serializer' }}
          CMS_PREVIEW_SERIALIZER_READY: ${{ vars.CMS_PREVIEW_SERIALIZER_READY || 'false' }}
        run: |
          set -euo pipefail
          if [ "$VITE_CMS_PREVIEW_ENABLED" != "true" ]; then
            echo "VITE_CMS_PREVIEW_ENABLED must be true for this reviewed deploy" >&2
            exit 1
          fi
          if [ "$CMS_PREVIEW_ACCESS_VERIFIED" != "true" ]; then
            echo "CMS_PREVIEW_ACCESS_VERIFIED must be true before exposing reviewer artifacts" >&2
            exit 1
          fi
          case "$CMS_PREVIEW_TRANSPORT" in
            serializer)
              if [ "$CMS_PREVIEW_SERIALIZER_READY" != "true" ]; then
                echo "CMS_PREVIEW_SERIALIZER_READY must be true for the serializer preview transport" >&2
                exit 1
              fi
              ;;
            *)
              echo "CMS_PREVIEW_TRANSPORT must be serializer" >&2
              exit 1
              ;;
          esac
      - name: Fetch Admin milestone catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/milestones?state=all&sort=due_on&direction=asc&per_page=100" > "$RUNNER_TEMP/admin-milestones.json"
      - name: Create Admin status manifest
        env:
          ADMIN_STATUS_REVISION: ${{ steps.reviewed_ref.outputs.deploy_sha }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
        run: |
          set -euo pipefail
          # The trusted main checkout builds this metadata, like the other gate scripts.
          manifest="$({
            node "$RUNNER_TEMP/admin-status-gate/scripts/admin-status-manifest.mjs" \
              --environment "${CMS_TARGET^}" \
              --milestones "$RUNNER_TEMP/admin-milestones.json" \
              --repository "$GITHUB_REPOSITORY" \
              --revision "$ADMIN_STATUS_REVISION"
          })"
          printf 'ADMIN_STATUS_MANIFEST_BASE64=%s\n' "$manifest" >> "$GITHUB_ENV"
      - name: Report unavailable Studio connector storage
        if: inputs.target == 'development' || vars.CMS_MEDIA_MASTER_R2_BUCKET == ''
        run: echo "Studio connector download is unavailable because private master-media storage is not configured."
      - name: Build the exact-source Studio connector package
        if: inputs.target != 'development' && vars.CMS_MEDIA_MASTER_R2_BUCKET != ''
        env:
          # Supplier layer for the source readers in PR #20; see docs/config/studio-build-suppliers.md.
          CMS_STUDIO_API_ORIGIN: ${{ vars.CMS_STUDIO_API_ORIGIN }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || inputs.target != 'development' && secrets.VITE_FIREBASE_API_KEY || '' }}
          DEPLOY_SHA: ${{ steps.reviewed_ref.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --prefix agents/vmix
          node agents/vmix/build-windows.mjs --source-sha "$DEPLOY_SHA" --output "$RUNNER_TEMP/studio-connector"
      - name: Retain the Studio connector package for deployment
        if: inputs.target != 'development' && vars.CMS_MEDIA_MASTER_R2_BUCKET != ''
        uses: actions/upload-artifact@v7
        with:
          name: cms-studio-connector
          path: ${{ runner.temp }}/studio-connector/
          if-no-files-found: error
          retention-days: 1
      - name: Build admin app
        run: npm run admin:build
        env:
          # Source-reader integration is documented in docs/config/studio-build-suppliers.md.
          VITE_CMS_STUDIO_CONFIGURATION: ${{ inputs.target != 'development' && secrets.VITE_CMS_STUDIO_CONFIGURATION || '' }}
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || inputs.target != 'development' && secrets.VITE_FIREBASE_API_KEY || '' }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || inputs.target != 'development' && secrets.VITE_FIREBASE_APP_ID || '' }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN || inputs.target != 'development' && secrets.VITE_FIREBASE_AUTH_DOMAIN || '' }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID || inputs.target != 'development' && secrets.VITE_FIREBASE_PROJECT_ID || '' }}
          VITE_FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY || inputs.target != 'development' && secrets.VITE_FIREBASE_APPCHECK_SITE_KEY || '' }}
          VITE_FUNCTIONS_BASE_URL: ${{ vars.VITE_FUNCTIONS_BASE_URL || inputs.target != 'development' && secrets.VITE_FUNCTIONS_BASE_URL || '' }}
          # The preceding readiness gate fails closed unless the protected host,
          # terminal writeback, and production function pair are deliberately enabled.
          VITE_CMS_PREVIEW_ENABLED: ${{ vars.VITE_CMS_PREVIEW_ENABLED || 'false' }}
          VITE_USE_EMULATORS: "false"
          # The Admin refuses the dev Firebase project unless the build names the dev target.
          VITE_CMS_DEPLOYMENT_ENVIRONMENT: ${{ inputs.target == 'development' && 'development' || '' }}
          VITE_FIREBASE_EXPECTED_DEV_APP_ID: ${{ inputs.target == 'development' && vars.CMS_DEV_FIREBASE_WEB_APP_ID || '' }}
          VITE_PUBLIC_SITE_ORIGIN: ${{ inputs.target == 'development' && vars.CMS_DEV_PUBLIC_ORIGIN || '' }}
          # Operator assertion only after the author-route activation packet passes.
          VITE_AUTHOR_PAGES_LIVE: ${{ vars.AUTHOR_PAGES_LIVE || 'false' }}
          VITE_VIDEO_REPLACEMENT_ENABLED: ${{ vars.VITE_VIDEO_REPLACEMENT_ENABLED || 'false' }}
          # Private studio pilot route; staff with global content.edit.any only.
          VITE_LIVE_PRODUCTION_ENABLED: ${{ inputs.target != 'development' && vars.LIVE_PRODUCTION_ENABLED || 'false' }}
          GH_TOKEN: ""
          GITHUB_TOKEN: ""
      - name: Require Pages file size limit
        run: |
          set -euo pipefail
          large="$(find admin/dist -type f -size +26214400c -print)"
          if [[ -n "$large" ]]; then
            echo "::error::Admin artifact has files over 25 MiB:"
            echo "$large"
            exit 1
          fi
      - name: Upload admin artifact
        uses: actions/upload-artifact@v7
        with:
          name: cms-staging-admin
          path: admin/dist/
          if-no-files-found: error
          retention-days: 1

  # Credential-free checks cost about 4-5 hosted minutes; stop before preflight
  # changes Authentication, TTLs, secrets or private storage (#4334).
  verify:
    env:
      CMS_DEPLOY_OWNER: ${{ vars.CMS_DEPLOY_OWNER }}
    name: Verify deploy sources before any mutation
    # Reads no secret; the release runner requires every job of a development run in the development environment.
    environment: ${{ inputs.target == 'development' && 'development' || 'production' }}
    if: >-
      (vars.CANONICAL_GITHUB_REPOSITORY != '' && vars.CANONICAL_GITHUB_REPOSITORY_ID != '' && github.repository == vars.CANONICAL_GITHUB_REPOSITORY && github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID) &&
      (vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER) && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    outputs:
      function_targets: ${{ steps.function_plan.outputs.function_targets }}
    runs-on: ubuntu-24.04
    timeout-minutes: 12 # About 4-5m expected, with cold-install headroom (#4334).
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.deploy_ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted release source gate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-gate
          persist-credentials: false
      - name: Isolate trusted release-gate checkout
        run: |
          set -euo pipefail
          mv .release-gate "$RUNNER_TEMP/release-gate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/release-gate/node_modules"
      - name: Require reviewed deploy ref
        env:
          EMERGENCY_RELEASE: ${{ inputs.emergency_release || false }}
          EMERGENCY_AUTHORIZATION: ${{ inputs.emergency_authorization || '' }}
        run: |
          set -euo pipefail
          # fetch-depth: 0 already fetched origin/main without retaining auth.
          node "$RUNNER_TEMP/release-gate"/.github/scripts/require-release-source.mjs
      - name: Require pinned release and trusted workflow identities
        env:
          CMS_RELEASE_CHECKS_SHA: ${{ inputs.deploy_ref }}
          CMS_TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: node "$RUNNER_TEMP/release-gate"/.github/scripts/require-cms-release-sources.mjs
      - name: Metered-API source scan (before any scanned code runs)
        run: node "$RUNNER_TEMP/release-gate"/.github/scripts/metered-api-scan.mjs --target-root "$GITHUB_WORKSPACE"
      - name: Metered-API source scan for current release gate
        working-directory: ${{ runner.temp }}/release-gate
        run: node .github/scripts/metered-api-scan.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          package-manager-cache: false
      - name: Install workspace deps
        run: npm ci --ignore-scripts
      - name: Install Site deps
        run: |
          npm --prefix site ci --ignore-scripts --no-audit --no-fund
          npm run functions:build --if-present
      - name: Install preview renderer deps
        run: npm --prefix preview-renderer ci --ignore-scripts --no-audit --no-fund
      - name: Verify CMS API Worker
        run: |
          set -euo pipefail
          npm run cms-api:check
          npm run cms-api:test
          npx --no-install wrangler deploy --cwd cms-api --dry-run
      - name: Verify preview renderer sources
        env:
          CLOUDFLARE_ACCOUNT_ID: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          set -euo pipefail
          npm --prefix preview-renderer run check
          npm run test:preview-renderer
          node preview-renderer/node_modules/wrangler/bin/wrangler.js types --config preview-renderer/wrangler.jsonc --strict-vars=false --include-runtime=false --check preview-renderer/worker-configuration.d.ts
          node scripts/check-prepared-worker.mjs preview-renderer "$(git rev-parse HEAD)"
      - name: Render deployment resource configuration
        run: node "$RUNNER_TEMP/release-gate/scripts/render-development-config.mjs" "${CMS_TARGET_RENDER_SCOPE:?}" --root "$GITHUB_WORKSPACE"
      - name: Require the deployed function manifest to match the smoke gate
        id: function_plan
        env:
          DEPLOY_SHA: ${{ inputs.deploy_ref }}
        run: node scripts/component-runner.mjs functions manifest
  firebase-preflight:
    env:
      CMS_DEPLOY_OWNER: ${{ vars.CMS_DEPLOY_OWNER }}
    needs: [admin-build, verify]
    permissions:
      contents: read
      actions: read
    environment: ${{ inputs.target == 'development' && 'development' || 'production' }}
    if: >-
      (vars.CANONICAL_GITHUB_REPOSITORY != '' && vars.CANONICAL_GITHUB_REPOSITORY_ID != '' && github.repository == vars.CANONICAL_GITHUB_REPOSITORY && github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID) &&
      (vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER) && github.ref == 'refs/heads/main'
    # Deploy credentials must not share PR slots or their writable disk.
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # Runaway guard: 3x max rounds to 11m; retain 20m floor (#2657).
    outputs:
      functions_mutated: ${{ steps.release_plan.outputs.functions_mutated }}
      selected_migrations: ${{ steps.release_plan.outputs.selected_migrations }}
      function_deploy_targets: ${{ steps.release_plan.outputs.function_deploy_targets }}
      preview_pause_late: ${{ steps.release_plan.outputs.preview_pause_late }}
      functions_before_preview: ${{ steps.release_plan.outputs.functions_before_preview }}
      functions_during_preview: ${{ steps.release_plan.outputs.functions_during_preview }}
      renderer_input_fingerprint: ${{ steps.release_plan.outputs.renderer_input_fingerprint }}
      edge_origin_secret_fingerprint: ${{ steps.release_plan.outputs.edge_origin_secret_fingerprint }}
      functions_configuration_fingerprint: ${{ steps.release_plan.outputs.functions_configuration_fingerprint }}
      functions_variables_fingerprint: ${{ steps.release_plan.outputs.functions_variables_fingerprint }}
      preview_paused: ${{ steps.release_plan.outputs.preview_paused }}
      preview_protocol: ${{ steps.release_plan.outputs.preview_protocol }}
      live_functions_sha: ${{ steps.release_plan.outputs.live_functions_sha }}
      renderer_target_sha: ${{ steps.release_plan.outputs.renderer_target_sha }}
      configuration_requires_release: ${{ steps.release_plan.outputs.configuration_requires_release }}
      release_reason: ${{ steps.release_plan.outputs.release_reason }}
      reader_binding: ${{ steps.reader_binding.outputs.binding }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admin-build.outputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Check out trusted release source gate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-gate
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Isolate trusted release-gate checkout
        run: |
          set -euo pipefail
          mv .release-gate "$RUNNER_TEMP/release-gate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/release-gate/node_modules"
      - name: Require reviewed deploy ref
        env:
          EMERGENCY_RELEASE: ${{ inputs.emergency_release || false }}
          EMERGENCY_AUTHORIZATION: ${{ inputs.emergency_authorization || '' }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          node "$RUNNER_TEMP/release-gate"/.github/scripts/require-release-source.mjs
      - name: Check out the exact CMS smoke gate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .cms-smoke-gate
          persist-credentials: false
      - name: Isolate trusted cms-smoke-gate checkout
        run: |
          set -euo pipefail
          mv .cms-smoke-gate "$RUNNER_TEMP/cms-smoke-gate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/cms-smoke-gate/node_modules"
      - name: Check out trusted singleton contract source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .cms-contract-source
          persist-credentials: false
      - name: Isolate trusted singleton contract source
        run: |
          set -euo pipefail
          mv .cms-contract-source "$RUNNER_TEMP/cms-contract-source"
      - name: Require pinned release and trusted workflow identities
        env:
          CMS_RELEASE_CHECKS_SHA: ${{ inputs.deploy_ref }}
          CMS_TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: node "$RUNNER_TEMP/release-gate"/.github/scripts/require-cms-release-sources.mjs
      - name: Metered-API source scan (before any scanned code runs)
        run: node "$RUNNER_TEMP/cms-smoke-gate"/.github/scripts/metered-api-scan.mjs --target-root "$GITHUB_WORKSPACE"
      - name: Check out trusted configuration renderer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .configuration-render-gate
          persist-credentials: false
          sparse-checkout: |
            scripts/render-development-config.mjs
            config/development-inputs.json
          sparse-checkout-cone-mode: false
      - name: Render deployment resource configuration
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mv .configuration-render-gate "$RUNNER_TEMP/configuration-render-gate"
          node "$RUNNER_TEMP/configuration-render-gate/scripts/render-development-config.mjs" "${CMS_TARGET_RENDER_SCOPE:?}" --root "$GITHUB_WORKSPACE"
      - name: Metered-API source scan for current CMS smoke gate
        working-directory: ${{ runner.temp }}/cms-smoke-gate
        run: node .github/scripts/metered-api-scan.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          package-manager-cache: false
      - name: Install workspace deps
        run: |
          npm ci --ignore-scripts
          npm --prefix site ci --ignore-scripts --no-audit --no-fund
          npm run functions:build --if-present
      - name: Prepare the singleton contract runtime before credentials
        env:
          CMS_DEV_PUBLISH_ENABLED: ${{ inputs.target == 'development' && vars.CMS_DEV_PUBLISH_ENABLED || '' }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
        run: >-
          node --import ./site/node_modules/tsx/dist/loader.mjs "$RUNNER_TEMP/cms-contract-source/scripts/check-cms-public-contract.mjs" prepare
          --environment "$CMS_TARGET" --candidate "$DEPLOY_SHA" --source-root "$GITHUB_WORKSPACE"
          --state-directory "$RUNNER_TEMP/cms-public-contract-private"
      - name: Authenticate Firebase deploy service account
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: ${{ env.CMS_TARGET_FIREBASE_PROJECT }}
      - name: Select the CMS reader binding
        # An ordinary deploy carries no reader binding (CenterCoopMedia/njpbs#561): dev binds every run,
        # production carries a live binding without an installed proof (none today).
        id: reader_binding
        if: ${{ !inputs.install_reader_bridge }}
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CMS_DEV_PUBLISH_ENABLED: ${{ inputs.target == 'development' && vars.CMS_DEV_PUBLISH_ENABLED || '' }}
        # Trusted main code decides, so an older release source never fails this read.
        run: node "$RUNNER_TEMP/cms-smoke-gate/scripts/cms-reader-binding.mjs" select
      - name: Require the legacy preview protocol before provider mutations
        run: node scripts/component-runner.mjs functions protocol
      - name: Verify the singleton public contract at preflight
        env:
          CMS_DEV_PUBLISH_ENABLED: ${{ inputs.target == 'development' && vars.CMS_DEV_PUBLISH_ENABLED || '' }}
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_BUG_REPORT_TELEGRAM_CHAT_ID: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_CHAT_ID }}
          CMS_BUG_REPORT_TELEGRAM_ADMIN_MAP: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_ADMIN_MAP }}
          CMS_DEPLOYMENT_VARIABLES_JSON: ${{ toJSON(vars) }}
          VITE_CMS_STUDIO_CONFIGURATION: ${{ inputs.target != 'development' && secrets.VITE_CMS_STUDIO_CONFIGURATION || '' }}
          VITE_LIVE_PRODUCTION_ENABLED: ${{ inputs.target != 'development' && vars.LIVE_PRODUCTION_ENABLED || 'false' }}
          CMS_MEDIA_CACHE_PURGE_TOKEN: ${{ secrets.CMS_MEDIA_CACHE_PURGE_TOKEN }}
          CMS_VOICEOVER_R2_ACCESS_KEY_ID: ${{ secrets.CMS_VOICEOVER_R2_ACCESS_KEY_ID }}
          CMS_VOICEOVER_R2_SECRET_ACCESS_KEY: ${{ secrets.CMS_VOICEOVER_R2_SECRET_ACCESS_KEY }}
          CMS_STAFF_EMAIL_API_TOKEN: ${{ secrets.CMS_STAFF_EMAIL_API_TOKEN }}
          CMS_BUG_REPORT_TELEGRAM_BOT_TOKEN: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_BOT_TOKEN }}
          CMS_BUG_REPORT_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_WEBHOOK_SECRET }}
          CMS_BUG_REPORT_GITHUB_TOKEN: ${{ secrets.CMS_BUG_REPORT_GITHUB_TOKEN }}
          CMS_BUG_REPORT_GITHUB_WEBHOOK_SECRET: ${{ secrets.CMS_BUG_REPORT_GITHUB_WEBHOOK_SECRET }}
          FORCE_FIREBASE: ${{ inputs.force_firebase || steps.reader_binding.outputs.binding != '' }}
          CMS_DEPLOY_MIGRATIONS: ${{ inputs.migrations }}
          CMS_EDGE_ORIGIN_SECRET: ${{ secrets.CMS_EDGE_ORIGIN_SECRET }}
          CLOUD_PUBLICATION_WAKE_ENVIRONMENT: ${{ env.CMS_TARGET }}
          CLOUD_PUBLICATION_WAKE_ENABLED: ${{ inputs.target != 'development' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_WEB_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || inputs.target != 'development' && secrets.VITE_FIREBASE_API_KEY || '' }}
          CMS_PREVIEW_R2_CREDENTIAL: ${{ secrets.CMS_PREVIEW_R2_CREDENTIAL }}
          CMS_TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          node --import ./site/node_modules/tsx/dist/loader.mjs "$RUNNER_TEMP/cms-contract-source/scripts/check-cms-public-contract.mjs" prove \
            --environment "$CMS_TARGET" --boundary preflight --candidate "$DEPLOY_SHA" --source-root "$GITHUB_WORKSPACE" \
            --summary "$RUNNER_TEMP/cms-public-contract-summary-preflight.json" \
            --state-directory "$RUNNER_TEMP/cms-public-contract-private" 4<<< "$CMS_PREVIEW_R2_CREDENTIAL"
      - name: Retain only the sanitized singleton contract summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cms-public-contract-preflight
          path: ${{ runner.temp }}/cms-public-contract-summary-preflight.json
          if-no-files-found: error
          overwrite: true
      - name: Set up Google Cloud CLI
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: ${{ env.CMS_TARGET_FIREBASE_PROJECT }}
      - name: Check Containers reads before any provider mutation
        if: inputs.target != 'development' && vars.CMS_PREVIEW_CLOUD_ENABLED == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node "$RUNNER_TEMP/release-gate/.github/scripts/cms-containers-read-probe.mjs"
      - name: Require the provisioned published Post reader secret
        env:
          FUNCTION_TARGETS: ${{ needs.verify.outputs.function_targets }}
        run: |
          set -euo pipefail
          if [[ ",$FUNCTION_TARGETS," != *",functions:cmsGetPublishedPost,"* ]]; then
            exit 0
          fi
          secret_state="$(gcloud secrets versions describe latest \
            --secret=PUBLISHED_POST_READER_HMAC_KEY \
            --project="$CMS_TARGET_FIREBASE_PROJECT" --format='value(state)')" || {
            echo "PUBLISHED_POST_READER_HMAC_KEY must already have an enabled version" >&2
            exit 1
          }
          if [[ "$secret_state" != ENABLED ]]; then
            echo "PUBLISHED_POST_READER_HMAC_KEY must already have an enabled version" >&2
            exit 1
          fi
      - name: Verify Functions configuration without provider writes
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_DEPLOYMENT_VARIABLES_JSON: ${{ toJSON(vars) }}
          VITE_CMS_STUDIO_CONFIGURATION: ${{ inputs.target != 'development' && secrets.VITE_CMS_STUDIO_CONFIGURATION || '' }}
          VITE_LIVE_PRODUCTION_ENABLED: ${{ inputs.target != 'development' && vars.LIVE_PRODUCTION_ENABLED || 'false' }}
          CMS_ADMIN_BUILD_REVISION: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_PREVIEW_RENDERER_SHA: ${{ env.CMS_TARGET_RENDERER_SHA || needs.admin-build.outputs.deploy_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_BUG_REPORT_TELEGRAM_CHAT_ID: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_CHAT_ID }}
          CMS_BUG_REPORT_TELEGRAM_ADMIN_MAP: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_ADMIN_MAP }}
          FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CMS_BUG_REPORT_GITHUB_TOKEN: ${{ secrets.CMS_BUG_REPORT_GITHUB_TOKEN }}
          CMS_BUG_REPORT_GITHUB_WEBHOOK_SECRET: ${{ secrets.CMS_BUG_REPORT_GITHUB_WEBHOOK_SECRET }}
          CMS_BUG_REPORT_TELEGRAM_BOT_TOKEN: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_BOT_TOKEN }}
          CMS_BUG_REPORT_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_WEBHOOK_SECRET }}
          CMS_EDGE_ORIGIN_SECRET: ${{ secrets.CMS_EDGE_ORIGIN_SECRET }}
          CMS_MEDIA_CACHE_PURGE_TOKEN: ${{ secrets.CMS_MEDIA_CACHE_PURGE_TOKEN }}
          CMS_STAFF_EMAIL_API_TOKEN: ${{ secrets.CMS_STAFF_EMAIL_API_TOKEN }}
          CMS_VOICEOVER_R2_ACCESS_KEY_ID: ${{ secrets.CMS_VOICEOVER_R2_ACCESS_KEY_ID }}
          CMS_VOICEOVER_R2_SECRET_ACCESS_KEY: ${{ secrets.CMS_VOICEOVER_R2_SECRET_ACCESS_KEY }}
        run: node scripts/component-runner.mjs functions verify-config
      - name: Verify selected event trigger IAM before mutation
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          CLOUD_PUBLICATION_WAKE_ENVIRONMENT: ${{ env.CMS_TARGET }}
          CLOUD_PUBLICATION_WAKE_ENABLED: ${{ inputs.target != 'development' }}
        run: node "$RUNNER_TEMP/cms-smoke-gate/scripts/check-cms-secret-iam.mjs" "$GITHUB_WORKSPACE" --pre-deploy
      - name: Verify Admin App Check registration
        env:
          FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID || inputs.target != 'development' && secrets.VITE_FIREBASE_APP_ID || '' }}
          FIREBASE_APPCHECK_SITE_KEY: ${{ vars.VITE_FIREBASE_APPCHECK_SITE_KEY || inputs.target != 'development' && secrets.VITE_FIREBASE_APPCHECK_SITE_KEY || '' }}
        run: |
          set -euo pipefail
          if [[ ! "$FIREBASE_APP_ID" =~ ^1:([0-9]+):web:[[:alnum:]]+$ ]]; then
            echo "::error::VITE_FIREBASE_APP_ID must be a Firebase web app id."
            exit 1
          fi

          project_number="${BASH_REMATCH[1]}"
          expected_name="projects/${project_number}/apps/${FIREBASE_APP_ID}/recaptchaEnterpriseConfig"
          config_path="$RUNNER_TEMP/firebase-app-check-config.json"
          access_token="$(gcloud auth print-access-token)"
          if ! curl --silent --show-error --fail \
            --request GET \
            --header "Authorization: Bearer $access_token" \
            --output "$config_path" \
            "https://firebaseappcheck.googleapis.com/v1/projects/${project_number}/apps/${FIREBASE_APP_ID}/recaptchaEnterpriseConfig"
          then
            unset access_token
            echo "::error::The Admin web app is not registered with Firebase App Check reCAPTCHA Enterprise."
            exit 1
          fi
          unset access_token

          node - "$config_path" "$expected_name" <<'NODE'
          const { readFileSync } = require("node:fs");
          const [configPath, expectedName] = process.argv.slice(2);
          const expectedSiteKey = process.env.FIREBASE_APPCHECK_SITE_KEY;
          const config = JSON.parse(readFileSync(configPath, "utf8"));

          if (
            config?.name !== expectedName ||
            typeof config?.siteKey !== "string" ||
            config.siteKey !== expectedSiteKey
          ) {
            console.error(
              "Firebase App Check registration does not match the Admin build",
            );
            process.exit(1);
          }
          NODE
          rm -f "$config_path"
      - name: Plan Functions and renderer release
        id: release_plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          FUNCTION_TARGETS: ${{ needs.verify.outputs.function_targets }}
          CMS_BUG_REPORT_TELEGRAM_CHAT_ID: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_CHAT_ID }}
          CMS_BUG_REPORT_TELEGRAM_ADMIN_MAP: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_ADMIN_MAP }}
          CMS_DEPLOYMENT_VARIABLES_JSON: ${{ toJSON(vars) }}
          VITE_CMS_STUDIO_CONFIGURATION: ${{ inputs.target != 'development' && secrets.VITE_CMS_STUDIO_CONFIGURATION || '' }}
          VITE_LIVE_PRODUCTION_ENABLED: ${{ inputs.target != 'development' && vars.LIVE_PRODUCTION_ENABLED || 'false' }}
          CMS_MEDIA_CACHE_PURGE_TOKEN: ${{ secrets.CMS_MEDIA_CACHE_PURGE_TOKEN }}
          CMS_VOICEOVER_R2_ACCESS_KEY_ID: ${{ secrets.CMS_VOICEOVER_R2_ACCESS_KEY_ID }}
          CMS_VOICEOVER_R2_SECRET_ACCESS_KEY: ${{ secrets.CMS_VOICEOVER_R2_SECRET_ACCESS_KEY }}
          CMS_STAFF_EMAIL_API_TOKEN: ${{ secrets.CMS_STAFF_EMAIL_API_TOKEN }}
          CMS_BUG_REPORT_TELEGRAM_BOT_TOKEN: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_BOT_TOKEN }}
          CMS_BUG_REPORT_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_WEBHOOK_SECRET }}
          CMS_BUG_REPORT_GITHUB_TOKEN: ${{ secrets.CMS_BUG_REPORT_GITHUB_TOKEN }}
          CMS_BUG_REPORT_GITHUB_WEBHOOK_SECRET: ${{ secrets.CMS_BUG_REPORT_GITHUB_WEBHOOK_SECRET }}
          # A bound run redeploys Functions so they carry this run's reader candidates.
          FORCE_FIREBASE: ${{ inputs.force_firebase || steps.reader_binding.outputs.binding != '' }}
          CMS_DEPLOY_MIGRATIONS: ${{ inputs.migrations }}
          CMS_EDGE_ORIGIN_SECRET: ${{ secrets.CMS_EDGE_ORIGIN_SECRET }}
          CLOUD_PUBLICATION_WAKE_ENVIRONMENT: ${{ env.CMS_TARGET }}
          CLOUD_PUBLICATION_WAKE_ENABLED: ${{ inputs.target != 'development' }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$GITHUB_SHA"
          node scripts/component-runner.mjs functions plan
      - name: Clean up deploy preflight files
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-auth-config.json"
      - name: Download the exact-source Studio connector package
        if: inputs.target != 'development' && vars.CMS_MEDIA_MASTER_R2_BUCKET != ''
        uses: actions/download-artifact@v8
        with:
          name: cms-studio-connector
          path: ${{ runner.temp }}/studio-connector/
      - name: Store the Studio connector in private media storage
        if: inputs.target != 'development' && vars.CMS_MEDIA_MASTER_R2_BUCKET != ''
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_MEDIA_MASTER_R2_BUCKET: ${{ vars.CMS_MEDIA_MASTER_R2_BUCKET }}
        run: |
          set -euo pipefail
          id=$(npx --no-install firebase --non-interactive functions:secrets:access CMS_MEDIA_R2_ACCESS_KEY_ID --project "$CMS_TARGET_FIREBASE_PROJECT")
          secret=$(npx --no-install firebase --non-interactive functions:secrets:access CMS_MEDIA_R2_SECRET_ACCESS_KEY --project "$CMS_TARGET_FIREBASE_PROJECT")
          echo "::add-mask::$id"
          echo "::add-mask::$secret"
          if [[ -z "$id" || -z "$secret" ]]; then
            echo "Studio connector storage credentials are empty." >&2
            exit 1
          fi
          export CMS_MEDIA_R2_ACCESS_KEY_ID="$id" CMS_MEDIA_R2_SECRET_ACCESS_KEY="$secret"
          export CMS_MEDIA_R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          node scripts/upload-studio-connector.mjs "$RUNNER_TEMP/studio-connector/manifest.json"
      - name: Remove private singleton contract inputs and processes
        if: always()
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker ps --all --quiet --filter "label=njpbs.cms-contract=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB")
          if [ "${#containers[@]}" -gt 0 ]; then docker rm --force "${containers[@]}"; fi
          sudo rm -rf -- "$RUNNER_TEMP/cms-public-contract-private"

  cms-api:
    env:
      CMS_DEPLOY_OWNER: ${{ vars.CMS_DEPLOY_OWNER }}
    # Deploy the origin functions first. A new edge route must never forward to
    # a function name that Firebase has not made available yet.
    needs: [admin-build, firebase-preflight, firebase]
    environment: ${{ inputs.target == 'development' && 'development' || 'production' }}
    if: >-
      (vars.CANONICAL_GITHUB_REPOSITORY != '' && vars.CANONICAL_GITHUB_REPOSITORY_ID != '' && github.repository == vars.CANONICAL_GITHUB_REPOSITORY && github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID) &&
      (vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER) && github.ref == 'refs/heads/main'
    # Deploy credentials must not share PR slots or their writable disk.
    runs-on: ubuntu-24.04
    timeout-minutes: 30 # Runaway guard: 22m retry windows + 3x successful max (8m); #2657.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admin-build.outputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Check out trusted release source gate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-gate
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts
            scripts/render-development-config.mjs
            config/development-inputs.json
          persist-credentials: false
      - name: Isolate trusted release-gate checkout
        run: |
          set -euo pipefail
          mv .release-gate "$RUNNER_TEMP/release-gate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/release-gate/node_modules"
      - name: Require reviewed deploy ref
        env:
          EMERGENCY_RELEASE: ${{ inputs.emergency_release || false }}
          EMERGENCY_AUTHORIZATION: ${{ inputs.emergency_authorization || '' }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          node "$RUNNER_TEMP/release-gate"/.github/scripts/require-release-source.mjs
      - name: Require pinned release and trusted workflow identities
        env:
          CMS_RELEASE_CHECKS_SHA: ${{ inputs.deploy_ref }}
          CMS_TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: node "$RUNNER_TEMP/release-gate"/.github/scripts/require-cms-release-sources.mjs
      - name: Metered-API source scan (before any scanned code runs)
        run: node "$RUNNER_TEMP/release-gate"/.github/scripts/metered-api-scan.mjs --target-root "$GITHUB_WORKSPACE"
      - name: Render deployment resource configuration
        run: node "$RUNNER_TEMP/release-gate/scripts/render-development-config.mjs" "${CMS_TARGET_RENDER_SCOPE:?}" --root "$GITHUB_WORKSPACE"
      - name: Refuse the retired settings-probe bypass
        run: |
          set -euo pipefail
          if grep -R --fixed-strings "ADMIN_DEPLOY_SETTINGS_PROBE_TOKEN" cms-api >/dev/null; then
            echo "::error::cms-api still contains the retired unauthenticated settings probe. Deploy a reviewed Worker that authenticates settings requests."
            exit 1
          fi
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          package-manager-cache: false
      # Firebase CI verifies the Worker with both trees installed. The cms-api
      # tests import site/scripts modules, whose tsconfig extends astro, so the
      # Site tree must exist here too (run 40807128961, tests/preflight parity).
      - name: Install workspace deps
        run: npm ci --ignore-scripts
      - name: Install Site deps
        run: npm --prefix site ci --ignore-scripts --no-audit --no-fund
      - name: Prepare CMS API Worker secrets file
        env:
          CMS_EDGE_ORIGIN_SECRET: ${{ secrets.CMS_EDGE_ORIGIN_SECRET }}
          FIREBASE_WEB_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || inputs.target != 'development' && secrets.VITE_FIREBASE_API_KEY || '' }}
        run: |
          set -euo pipefail
          if [ "${#CMS_EDGE_ORIGIN_SECRET}" -lt 32 ]; then
            echo "CMS_EDGE_ORIGIN_SECRET must contain at least 32 characters" >&2
            exit 1
          fi
          secrets_path="$RUNNER_TEMP/cms-api-secrets.json"
          umask 077
          node - "$secrets_path" <<'NODE'
          const { writeFileSync } = require("node:fs");
          const [secretsPath] = process.argv.slice(2);
          const firebaseWebApiKey = process.env.FIREBASE_WEB_API_KEY?.trim();
          if (!firebaseWebApiKey) throw new Error("FIREBASE_WEB_API_KEY is required for the byline edge route");
          writeFileSync(
            secretsPath,
            JSON.stringify({
              CMS_EDGE_ORIGIN_SECRET: process.env.CMS_EDGE_ORIGIN_SECRET,
              FIREBASE_WEB_API_KEY: firebaseWebApiKey,
            }),
            { mode: 0o600 },
          );
          NODE
      - name: Plan the CMS API Worker release
        id: cms_api_plan
        # Planned in this job so a partial rerun recomputes it. Only an explicit
        # false skips the Worker deploy.
        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_EDGE_ORIGIN_SECRET_FINGERPRINT: ${{ needs.firebase-preflight.outputs.edge_origin_secret_fingerprint }}
          CONFIGURATION_REQUIRES_RELEASE: ${{ needs.firebase-preflight.outputs.configuration_requires_release }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/component-runner.mjs cmsApi plan \
            --source-sha "$DEPLOY_SHA" \
            --trusted-workflow-sha "$GITHUB_SHA" \
            --secrets-file "$RUNNER_TEMP/cms-api-secrets.json" \
            --configuration-fingerprint-file "$RUNNER_TEMP/cms-api-configuration.sha256"
      - name: Bind and start the original production API reader candidate
        if: inputs.install_reader_bridge
        env:
          CMS_PRODUCTION_INSTALL_READER_BRIDGE: ${{ inputs.install_reader_bridge }}
          CMS_PRODUCTION_READER_OPERATION_ID: ${{ inputs.reader_operation_id }}
          CMS_PRODUCTION_READER_INSTALL_AUTHORIZATION: ${{ inputs.reader_install_authorization }}
          CMS_DEPLOYMENT_ENVIRONMENT: ${{ env.CMS_TARGET }}
          FIREBASE_PROJECT_ID: ${{ env.CMS_TARGET_FIREBASE_PROJECT }}
          FORCE_FIREBASE: ${{ inputs.force_firebase }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/production-reader-deployment.mjs start cmsApi
      - name: Mark the CMS API receipt in progress
        if: (steps.cms_api_plan.outputs.mutated != 'false' || needs.firebase-preflight.outputs.reader_binding != '') && !inputs.install_reader_bridge
        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
        run: |
          node scripts/component-runner.mjs cmsApi start \
            --source-sha "$DEPLOY_SHA" \
            --trusted-workflow-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Bind the CMS readers into the CMS API config
        if: needs.firebase-preflight.outputs.reader_binding != ''
        env:
          CMS_READER_BINDING: ${{ needs.firebase-preflight.outputs.reader_binding }}
        run: node scripts/cms-reader-binding.mjs bind cmsApi
      - name: Deploy CMS API Worker
        # A bound run deploys the Worker with this run's reader binding.
        if: steps.cms_api_plan.outputs.mutated != 'false' || needs.firebase-preflight.outputs.reader_binding != ''
        id: deploy_cms_api
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -euo pipefail
          version_id="$(node scripts/deploy-cms-api-worker.mjs "$RUNNER_TEMP/cms-api-secrets.json")"
          printf 'version_id=%s\n' "$version_id" >> "$GITHUB_OUTPUT"
      - name: Clean up CMS API Worker secrets file
        if: always()
        run: rm -f "$RUNNER_TEMP/cms-api-secrets.json"
      - name: Smoke-test CMS API edge
        run: |
          set -euo pipefail
          # A first custom-domain request can receive a negatively cached DNS
          # miss. Resolve through a fresh DoH path and allow propagation time.
          retry_args=(--retry 18 --retry-delay 10 --retry-max-time 180 --retry-all-errors --doh-url https://1.1.1.1/dns-query)
          test "$(curl "${retry_args[@]}" --silent --show-error --output /dev/null --write-out '%{http_code}' "${CMS_TARGET_API_ORIGIN}/health")" = "200"
          test "$(curl "${retry_args[@]}" --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{}' \
            "${CMS_TARGET_API_ORIGIN}/cmsListContent")" = "401"
      - name: Verify legacy settings transition boundaries before Admin
        run: |
          set -euo pipefail
          expect_transition_status() {
            local expected_status="$1"
            local label="$2"
            shift 2
            local status="000"
            for attempt in {1..19}; do
              if status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 10 --max-time 15 --doh-url https://1.1.1.1/dns-query "$@")" \
                && [ "$status" = "$expected_status" ]; then
                return 0
              fi
              if [ "$attempt" -lt 19 ]; then
                echo "$label returned HTTP $status; waiting for propagation (attempt $attempt/19)."
                sleep 10
              fi
            done
            echo "::error::$label returned HTTP $status; expected $expected_status."
            return 1
          }
          for endpoint in cmsPublishSettings; do
            expect_transition_status 401 "edge $endpoint" \
              --request POST --header "Origin: $CMS_TARGET_ADMIN_ORIGIN" \
              --header 'Content-Type: application/json' --data '{}' \
              "${CMS_TARGET_API_ORIGIN}/$endpoint"
            expect_transition_status 403 "direct origin $endpoint" \
              --request POST --header "Origin: $CMS_TARGET_ADMIN_ORIGIN" \
              --header 'Content-Type: application/json' --data '{}' \
              "https://us-central1-$CMS_TARGET_FIREBASE_PROJECT.cloudfunctions.net/$endpoint"
          done
      - name: Record the completed CMS API receipt
        if: (steps.cms_api_plan.outputs.mutated != 'false' || needs.firebase-preflight.outputs.reader_binding != '') && !inputs.install_reader_bridge
        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          DEPLOYED_WORKER_VERSION: ${{ steps.deploy_cms_api.outputs.version_id }}
        run: |
          node scripts/component-runner.mjs cmsApi complete \
            --source-sha "$DEPLOY_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --configuration-fingerprint-file "$RUNNER_TEMP/cms-api-configuration.sha256" \
            --expected-worker-version "$DEPLOYED_WORKER_VERSION" \
            --live
      - name: Record and verify this run's CMS reader candidates
        if: needs.firebase-preflight.outputs.reader_binding != '' && !inputs.install_reader_bridge
        env:
          CMS_READER_BINDING: ${{ needs.firebase-preflight.outputs.reader_binding }}
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          DEPLOYED_WORKER_VERSION: ${{ steps.deploy_cms_api.outputs.version_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CMS_DEV_CLOUDFLARE_ACCOUNT_ID: ${{ inputs.target == 'development' && vars.CMS_DEV_CLOUDFLARE_ACCOUNT_ID || '' }}
        run: |
          set -euo pipefail
          # The Functions readback uses ADC; keep its file inside this step.
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          umask 077
          printf '%s' "$SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          node scripts/cms-reader-binding.mjs record
      - name: Verify and record the original production API reader and complete mount
        if: inputs.install_reader_bridge
        env:
          CMS_PRODUCTION_INSTALL_READER_BRIDGE: ${{ inputs.install_reader_bridge }}
          CMS_PRODUCTION_READER_OPERATION_ID: ${{ inputs.reader_operation_id }}
          CMS_PRODUCTION_READER_INSTALL_AUTHORIZATION: ${{ inputs.reader_install_authorization }}
          CMS_DEPLOYMENT_ENVIRONMENT: ${{ env.CMS_TARGET }}
          FIREBASE_PROJECT_ID: ${{ env.CMS_TARGET_FIREBASE_PROJECT }}
          FORCE_FIREBASE: ${{ inputs.force_firebase }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/production-reader-deployment.mjs complete cmsApi "$RUNNER_TEMP/production-reader-deployment-receipt.json"
      - name: Retain original production reader deployment identities
        if: inputs.install_reader_bridge
        uses: actions/upload-artifact@v7
        with:
          name: production-reader-deployment-receipt
          path: ${{ runner.temp }}/production-reader-deployment-receipt.json
          if-no-files-found: error
      - name: Confirm the live CMS API identity
        if: steps.cms_api_plan.outputs.mutated == 'false' && needs.firebase-preflight.outputs.reader_binding == ''
        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/component-runner.mjs cmsApi confirm

  firebase:
    env:
      CMS_DEPLOY_OWNER: ${{ vars.CMS_DEPLOY_OWNER }}
    needs: [admin-build, firebase-preflight, verify]
    environment: ${{ inputs.target == 'development' && 'development' || 'production' }}
    if: >-
      (vars.CANONICAL_GITHUB_REPOSITORY != '' && vars.CANONICAL_GITHUB_REPOSITORY_ID != '' && github.repository == vars.CANONICAL_GITHUB_REPOSITORY && github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID) &&
      (vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER) && github.ref == 'refs/heads/main'
    # Deploy credentials must not share PR slots or their writable disk.
    runs-on: ubuntu-24.04
    timeout-minutes: 107 # Runaway guard: 3x max 35m25s (14d, 2026-10-26; #2657).
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admin-build.outputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Check out trusted release source gate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-gate
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            .github/scripts
            scripts/render-development-config.mjs
            config/development-inputs.json
          persist-credentials: false
      - name: Isolate trusted release-gate checkout
        run: |
          set -euo pipefail
          mv .release-gate "$RUNNER_TEMP/release-gate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/release-gate/node_modules"
      - name: Require reviewed deploy ref
        env:
          EMERGENCY_RELEASE: ${{ inputs.emergency_release || false }}
          EMERGENCY_AUTHORIZATION: ${{ inputs.emergency_authorization || '' }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          node "$RUNNER_TEMP/release-gate"/.github/scripts/require-release-source.mjs
      - name: Require pinned release and trusted workflow identities
        env:
          CMS_RELEASE_CHECKS_SHA: ${{ inputs.deploy_ref }}
          CMS_TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: node "$RUNNER_TEMP/release-gate"/.github/scripts/require-cms-release-sources.mjs
      - name: Render deployment resource configuration
        run: node "$RUNNER_TEMP/release-gate/scripts/render-development-config.mjs" "${CMS_TARGET_RENDER_SCOPE:?}" --root "$GITHUB_WORKSPACE"
      - name: Metered-API source scan (before any scanned code runs)
        run: node "$RUNNER_TEMP/release-gate"/.github/scripts/metered-api-scan.mjs --target-root "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          package-manager-cache: false
      - name: Install workspace deps
        run: npm ci --ignore-scripts
      - name: Install Site release dependencies before mutation
        if: inputs.target != 'development' && vars.CMS_PREVIEW_CLOUD_ENABLED == 'true' && needs.firebase-preflight.outputs.preview_paused == 'true'
        run: npm --prefix site ci --ignore-scripts --no-audit --no-fund
      - name: Prepare Functions contracts and verify preview deploy flags
        env:
          CMS_PREVIEW_ACCESS_VERIFIED: ${{ vars.CMS_PREVIEW_ACCESS_VERIFIED || 'false' }}
          CMS_PREVIEW_TRANSPORT: ${{ vars.CMS_PREVIEW_TRANSPORT || 'serializer' }}
          CMS_PREVIEW_SERIALIZER_READY: ${{ vars.CMS_PREVIEW_SERIALIZER_READY || 'false' }}
        run: |
          set -euo pipefail
          if [ "$CMS_PREVIEW_ACCESS_VERIFIED" != "true" ]; then
            echo "CMS_PREVIEW_ACCESS_VERIFIED must be true before deploying preview functions" >&2
            exit 1
          fi
          case "$CMS_PREVIEW_TRANSPORT" in
            serializer)
              if [ "$CMS_PREVIEW_SERIALIZER_READY" != "true" ]; then
                echo "CMS_PREVIEW_SERIALIZER_READY must be true for the serializer preview transport" >&2
                exit 1
              fi
              ;;
            *)
              echo "CMS_PREVIEW_TRANSPORT must be serializer" >&2
              exit 1
