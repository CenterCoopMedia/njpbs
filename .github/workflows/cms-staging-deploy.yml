          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/component-runner.mjs cmsApi complete \
            --source-sha "$DEPLOY_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --configuration-fingerprint-file "$RUNNER_TEMP/cms-api-configuration.sha256" \
            --live
      - name: Verify and record the original production API reader and complete mount
        if: inputs.install_reader_bridge
        env:
          CMS_PRODUCTION_INSTALL_READER_BRIDGE: ${{ inputs.install_reader_bridge }}
          CMS_PRODUCTION_READER_OPERATION_ID: ${{ inputs.reader_operation_id }}
          CMS_PRODUCTION_READER_INSTALL_AUTHORIZATION: ${{ inputs.reader_install_authorization }}
          CMS_DEPLOYMENT_ENVIRONMENT: production
          FIREBASE_PROJECT_ID: njpbs-site
          FORCE_FIREBASE: ${{ inputs.force_firebase }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/production-reader-deployment.mjs complete cmsApi "$RUNNER_TEMP/production-reader-deployment-receipt.json"
      - name: Retain original production reader deployment identities
        if: inputs.install_reader_bridge
        uses: actions/upload-artifact@v7
        with:
          name: production-reader-deployment-receipt
          path: ${{ runner.temp }}/production-reader-deployment-receipt.json
          if-no-files-found: error
      - name: Confirm the live CMS API identity
        if: steps.cms_api_plan.outputs.mutated == 'false'
        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/component-runner.mjs cmsApi confirm

  firebase:
    env:
      CMS_DEPLOY_OWNER: ${{ vars.CMS_DEPLOY_OWNER }}
    needs: [admin-build, firebase-preflight, smoke-manifest, verify]
    environment: production
    if: >-
      (vars.CANONICAL_GITHUB_REPOSITORY != '' && vars.CANONICAL_GITHUB_REPOSITORY_ID != '' && github.repository == vars.CANONICAL_GITHUB_REPOSITORY && github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID) &&
      (vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER) && github.ref == 'refs/heads/main'
    # Deploy credentials must not share PR slots or their writable disk.
    runs-on: ubuntu-24.04
    timeout-minutes: 107 # Runaway guard: 3x max 35m25s (14d, 2026-10-26; #2657).
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admin-build.outputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Check out trusted release source gate
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-gate
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Isolate trusted release-gate checkout
        run: |
          set -euo pipefail
          mv .release-gate "$RUNNER_TEMP/release-gate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/release-gate/node_modules"
      - name: Require reviewed deploy ref
        env:
          EMERGENCY_RELEASE: ${{ inputs.emergency_release || false }}
          EMERGENCY_AUTHORIZATION: ${{ inputs.emergency_authorization || '' }}
        run: |
          set -euo pipefail
          git fetch origin main:refs/remotes/origin/main
          node "$RUNNER_TEMP/release-gate"/.github/scripts/require-release-source.mjs
      - name: Check out current metered-API scanner
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .metered-api-gate
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Isolate trusted metered-api-gate checkout
        run: |
          set -euo pipefail
          mv .metered-api-gate "$RUNNER_TEMP/metered-api-gate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/metered-api-gate/node_modules"
      - name: Require pinned release and trusted workflow identities
        env:
          CMS_RELEASE_CHECKS_SHA: ${{ inputs.deploy_ref }}
          CMS_TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: node "$RUNNER_TEMP/release-gate"/.github/scripts/require-cms-release-sources.mjs
      - name: Check out trusted configuration renderer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .configuration-render-gate
          persist-credentials: false
          sparse-checkout: |
            scripts/render-development-config.mjs
            config/development-inputs.json
          sparse-checkout-cone-mode: false
      - name: Render deployment resource configuration
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mv .configuration-render-gate "$RUNNER_TEMP/configuration-render-gate"
          node "$RUNNER_TEMP/configuration-render-gate/scripts/render-development-config.mjs" --production --root "$GITHUB_WORKSPACE"
      - name: Metered-API source scan (before any scanned code runs)
        run: node "$RUNNER_TEMP/metered-api-gate"/.github/scripts/metered-api-scan.mjs --target-root "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps
        run: npm ci --ignore-scripts
      - name: Install Site release dependencies before mutation
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true' && needs.firebase-preflight.outputs.preview_paused == 'true'
        run: npm --prefix site ci --ignore-scripts --no-audit --no-fund
      - name: Require publish deploy flags
        env:
          CMS_PUBLISH_TRANSPORT: ${{ vars.CMS_PUBLISH_TRANSPORT || 'github' }}
          CMS_WRITEBACK_CONFIGURED: ${{ vars.CMS_WRITEBACK_CONFIGURED }}
        run: |
          set -euo pipefail
          if [ "$CMS_WRITEBACK_CONFIGURED" != "true" ]; then
            echo "CMS_WRITEBACK_CONFIGURED must be true before staging deploy" >&2
            exit 1
          fi
          case "$CMS_PUBLISH_TRANSPORT" in
            github|serializer) ;;
            *)
              echo "CMS_PUBLISH_TRANSPORT must be github or serializer" >&2
              exit 1
              ;;
          esac
      - name: Require preview deploy flags
        env:
          CMS_PREVIEW_ACCESS_VERIFIED: ${{ vars.CMS_PREVIEW_ACCESS_VERIFIED || 'false' }}
          CMS_PREVIEW_TRANSPORT: ${{ vars.CMS_PREVIEW_TRANSPORT || 'serializer' }}
          CMS_PREVIEW_SERIALIZER_READY: ${{ vars.CMS_PREVIEW_SERIALIZER_READY || 'false' }}
        run: |
          set -euo pipefail
          if [ "$CMS_PREVIEW_ACCESS_VERIFIED" != "true" ]; then
            echo "CMS_PREVIEW_ACCESS_VERIFIED must be true before deploying preview functions" >&2
            exit 1
          fi
          case "$CMS_PREVIEW_TRANSPORT" in
            serializer)
              if [ "$CMS_PREVIEW_SERIALIZER_READY" != "true" ]; then
                echo "CMS_PREVIEW_SERIALIZER_READY must be true for the serializer preview transport" >&2
                exit 1
              fi
              ;;
            *)
              echo "CMS_PREVIEW_TRANSPORT must be serializer" >&2
              exit 1
              ;;
          esac
      - name: Configure Firebase credentials
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          set -euo pipefail
          credentials_path="$RUNNER_TEMP/firebase-service-account.json"
          umask 077
          printf '%s' "$SA" > "$credentials_path"
          project_id="$(node -e "const fs = require('node:fs'); const data = JSON.parse(fs.readFileSync(process.argv[1], 'utf8')); if (!data.project_id) process.exit(1); process.stdout.write(data.project_id);" "$credentials_path")"
          if [ "$project_id" != "njpbs-site" ]; then
            echo "FIREBASE_SERVICE_ACCOUNT project_id must be njpbs-site" >&2
            exit 1
          fi
          echo "GOOGLE_APPLICATION_CREDENTIALS=$credentials_path" >> "$GITHUB_ENV"
      - name: Set up Google Cloud CLI for Functions IAM
        uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3
        with:
          project_id: njpbs-site
      - name: Require the legacy preview protocol before Firebase mutation
        run: node scripts/component-runner.mjs functions protocol
      - name: Revalidate the selective release baseline before mutation
        if: needs.firebase-preflight.outputs.functions_mutated == 'true' && needs.firebase-preflight.outputs.function_deploy_targets != 'all'
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          LIVE_FUNCTIONS_SHA: ${{ needs.firebase-preflight.outputs.live_functions_sha }}
        run: |
          node scripts/component-runner.mjs functions confirm --source-sha "$LIVE_FUNCTIONS_SHA" \
            --resume-source-sha "$DEPLOY_SHA" --resume-run-id "$GITHUB_RUN_ID" --resume-run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Preflight production reader attempts before preview admission can pause
        if: inputs.install_reader_bridge
        env:
          CMS_PRODUCTION_INSTALL_READER_BRIDGE: ${{ inputs.install_reader_bridge }}
          CMS_PRODUCTION_READER_OPERATION_ID: ${{ inputs.reader_operation_id }}
          CMS_PRODUCTION_READER_INSTALL_AUTHORIZATION: ${{ inputs.reader_install_authorization }}
          CMS_DEPLOYMENT_ENVIRONMENT: production
          FIREBASE_PROJECT_ID: njpbs-site
          FORCE_FIREBASE: ${{ inputs.force_firebase }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
        run: node scripts/production-reader-deployment.mjs preflight functions
      - name: Mark the Functions receipt in progress
        if: needs.firebase-preflight.outputs.functions_mutated == 'true' && !inputs.install_reader_bridge
        env:
          RENDERER_TARGET_SHA: ${{ needs.firebase-preflight.outputs.renderer_target_sha }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
        run: |
          node scripts/component-runner.mjs functions start \
            --source-sha "$DEPLOY_SHA" \
            --trusted-workflow-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Prepare the original Functions retirement plan
        if: needs.firebase-preflight.outputs.functions_mutated == 'true' && !inputs.install_reader_bridge
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          FUNCTION_TARGETS: ${{ needs.smoke-manifest.outputs.function_targets }}
          CLOUD_PUBLICATION_WAKE_ENVIRONMENT: production
          CLOUD_PUBLICATION_WAKE_ENABLED: "true"
        run: node scripts/component-runner.mjs functions prepare
      - name: Mark the renderer receipt in progress
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true' && needs.firebase-preflight.outputs.preview_paused == 'true'
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          RENDERER_INPUT_FINGERPRINT: ${{ needs.firebase-preflight.outputs.renderer_input_fingerprint }}
        run: |
          node scripts/component-runner.mjs renderer start \
            --source-sha "$DEPLOY_SHA" \
            --input-fingerprint "$RENDERER_INPUT_FINGERPRINT" \
            --trusted-workflow-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Pause cloud preview admission before changing Functions
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true' && needs.firebase-preflight.outputs.preview_paused == 'true' && needs.firebase-preflight.outputs.preview_protocol == 'schema-one' && needs.firebase-preflight.outputs.preview_pause_late != 'true'
        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CMS_PREVIEW_R2_CREDENTIAL: ${{ secrets.CMS_PREVIEW_R2_CREDENTIAL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CMS_PREVIEW_TRANSPORT: ${{ vars.CMS_PREVIEW_TRANSPORT || 'serializer' }}
