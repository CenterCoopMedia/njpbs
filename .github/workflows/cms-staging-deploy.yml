          const firebaseWebApiKey = process.env.FIREBASE_WEB_API_KEY?.trim();
          if (!firebaseWebApiKey) throw new Error("FIREBASE_WEB_API_KEY is required for the byline edge route");
          writeFileSync(
            secretsPath,
            JSON.stringify({
              CMS_EDGE_ORIGIN_SECRET: process.env.CMS_EDGE_ORIGIN_SECRET,
              FIREBASE_WEB_API_KEY: firebaseWebApiKey,
