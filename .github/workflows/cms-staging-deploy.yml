      - name: Smoke-test CMS API edge
        run: |
          set -euo pipefail
          # A first custom-domain request can receive a negatively cached DNS
          # miss. Resolve through a fresh DoH path and allow propagation time.
          retry_args=(--retry 18 --retry-delay 10 --retry-max-time 180 --retry-all-errors --doh-url https://1.1.1.1/dns-query)
          test "$(curl "${retry_args[@]}" --silent --show-error --output /dev/null --write-out '%{http_code}' "${CMS_PRODUCTION_API_ORIGIN}/health")" = "200"
          test "$(curl "${retry_args[@]}" --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --request POST --header 'Content-Type: application/json' --data '{}' \
            "${CMS_PRODUCTION_API_ORIGIN}/cmsListContent")" = "401"
      - name: Verify legacy settings transition boundaries before Admin
        if: needs.admin-build.outputs.deploy_sha == github.sha
        run: |
          set -euo pipefail
          expect_transition_status() {
            local expected_status="$1"
            local label="$2"
            shift 2
            local status="000"
            for attempt in {1..19}; do
              if status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
                --connect-timeout 10 --max-time 15 --doh-url https://1.1.1.1/dns-query "$@")" \
                && [ "$status" = "$expected_status" ]; then
                return 0
              fi
              if [ "$attempt" -lt 19 ]; then
                echo "$label returned HTTP $status; waiting for propagation (attempt $attempt/19)."
                sleep 10
              fi
            done
            echo "::error::$label returned HTTP $status; expected $expected_status."
            return 1
          }
          for endpoint in cmsPublishSettings; do
            expect_transition_status 401 "edge $endpoint" \
              --request POST --header 'Origin: https://admin.njpbs.org' \
              --header 'Content-Type: application/json' --data '{}' \
              "${CMS_PRODUCTION_API_ORIGIN}/$endpoint"
            expect_transition_status 403 "direct origin $endpoint" \
              --request POST --header 'Origin: https://admin.njpbs.org' \
              --header 'Content-Type: application/json' --data '{}' \
              "https://us-central1-njpbs-site.cloudfunctions.net/$endpoint"
          done
      - name: Record the completed CMS API receipt
        if: steps.cms_api_plan.outputs.mutated != 'false' && !inputs.install_reader_bridge
