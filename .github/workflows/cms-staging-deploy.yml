          CLOUD_PUBLICATION_WAKE_ENABLED: "true"
        run: node scripts/component-runner.mjs functions prepare
      - name: Backfill page seed media records
        if: needs.firebase-preflight.outputs.functions_mutated == 'true' || contains(format(',{0},', needs.firebase-preflight.outputs.selected_migrations), ',page-seed-media,')
        run: node scripts/backfill-page-seed-media.mjs
      - name: Backfill and verify uploaded media thumbnails
