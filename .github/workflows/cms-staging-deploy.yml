      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      # Firebase CI verifies the Worker with both trees installed. The cms-api
      # tests import site/scripts modules, whose tsconfig extends astro, so the
      # Site tree must exist here too (run 40807128961, tests/preflight parity).
      - name: Install workspace deps
        run: npm ci --ignore-scripts
      - name: Install Site deps
        run: npm --prefix site ci --ignore-scripts --no-audit --no-fund
      - name: Prepare CMS API Worker secrets file
        env:
          CMS_EDGE_ORIGIN_SECRET: ${{ secrets.CMS_EDGE_ORIGIN_SECRET }}
