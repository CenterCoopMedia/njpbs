        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_EDGE_ORIGIN_SECRET_FINGERPRINT: ${{ needs.firebase-preflight.outputs.edge_origin_secret_fingerprint }}
          CONFIGURATION_REQUIRES_RELEASE: ${{ needs.firebase-preflight.outputs.configuration_requires_release }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          node scripts/component-runner.mjs cmsApi plan \
            --source-sha "$DEPLOY_SHA" \
            --trusted-workflow-sha "$GITHUB_SHA" \
            --secrets-file "$RUNNER_TEMP/cms-api-secrets.json" \
            --configuration-fingerprint-file "$RUNNER_TEMP/cms-api-configuration.sha256"
      - name: Bind and start the original production API reader candidate
        if: inputs.install_reader_bridge
        env:
          CMS_PRODUCTION_INSTALL_READER_BRIDGE: ${{ inputs.install_reader_bridge }}
          CMS_PRODUCTION_READER_OPERATION_ID: ${{ inputs.reader_operation_id }}
          CMS_PRODUCTION_READER_INSTALL_AUTHORIZATION: ${{ inputs.reader_install_authorization }}
          CMS_DEPLOYMENT_ENVIRONMENT: production
          FIREBASE_PROJECT_ID: njpbs-site
          FORCE_FIREBASE: ${{ inputs.force_firebase }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: node scripts/production-reader-deployment.mjs start cmsApi
      - name: Mark the CMS API receipt in progress
        if: steps.cms_api_plan.outputs.mutated != 'false' && !inputs.install_reader_bridge
        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
        run: |
          node scripts/component-runner.mjs cmsApi start \
            --source-sha "$DEPLOY_SHA" \
            --trusted-workflow-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Deploy CMS API Worker
        if: steps.cms_api_plan.outputs.mutated != 'false'
