            site/scripts/deploy-cms-preview-cloud.ts pause "$RENDERER_SHA"
      - name: Configure functions runtime params
        if: needs.firebase-preflight.outputs.functions_mutated == 'true'
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_DEPLOYMENT_VARIABLES_JSON: ${{ toJSON(vars) }}
          VITE_CMS_STUDIO_CONFIGURATION: ${{ secrets.VITE_CMS_STUDIO_CONFIGURATION }}
          VITE_LIVE_PRODUCTION_ENABLED: ${{ vars.LIVE_PRODUCTION_ENABLED || 'false' }}
          CMS_ADMIN_BUILD_REVISION: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_PREVIEW_RENDERER_SHA: ${{ needs.firebase-preflight.outputs.renderer_target_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_BUG_REPORT_TELEGRAM_CHAT_ID: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_CHAT_ID }}
          CMS_BUG_REPORT_TELEGRAM_ADMIN_MAP: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_ADMIN_MAP }}
        run: node scripts/component-runner.mjs functions configure
      - name: Bind and start the original production Functions reader candidate
        if: inputs.install_reader_bridge
        env:
          CMS_PRODUCTION_INSTALL_READER_BRIDGE: ${{ inputs.install_reader_bridge }}
          CMS_PRODUCTION_READER_OPERATION_ID: ${{ inputs.reader_operation_id }}
          CMS_PRODUCTION_READER_INSTALL_AUTHORIZATION: ${{ inputs.reader_install_authorization }}
