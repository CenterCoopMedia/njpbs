        run: |
          set -euo pipefail
          CMS_MEDIA_R2_ACCESS_KEY_ID="$(
            npx --no-install firebase --non-interactive functions:secrets:access \
              CMS_MEDIA_R2_ACCESS_KEY_ID --project njpbs-site
          )"
          export CMS_MEDIA_R2_ACCESS_KEY_ID
          CMS_MEDIA_R2_SECRET_ACCESS_KEY="$(
            npx --no-install firebase --non-interactive functions:secrets:access \
              CMS_MEDIA_R2_SECRET_ACCESS_KEY --project njpbs-site
          )"
          export CMS_MEDIA_R2_SECRET_ACCESS_KEY
          export CMS_MEDIA_R2_ENDPOINT="https://${CLOUDFLARE_ACCOUNT_ID}.r2.cloudflarestorage.com"
          export CMS_MEDIA_PUBLIC_ORIGIN="https://media.njpbs.org"
          node scripts/backfill-media-thumbnails.mjs --apply < "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Seed and verify the managed media-category registry
        if: needs.firebase-preflight.outputs.functions_mutated == 'true' || contains(format(',{0},', needs.firebase-preflight.outputs.selected_migrations), ',media-categories,')
        # The upload reservation now fails closed unless its immutable owning
        # category is active in mediaCategories. Seed every category already
        # referenced by an asset or recovery receipt before deploying that
        # enforcement, then read the registry back. The script creates only
        # missing rows and leaves staff-managed labels and lifecycle untouched.
        run: |
          set -euo pipefail
          node scripts/seed-media-categories.mjs
      - name: Backfill and verify media category assignments
        if: needs.firebase-preflight.outputs.functions_mutated == 'true' || contains(format(',{0},', needs.firebase-preflight.outputs.selected_migrations), ',media-category-assignments,')
        # Materialize the descriptive assignment list before the Admin begins
        # editing it. This preserves the owning category, URL, hash, asset id,
        # usage, and version while making the single-category fallback durable.
        run: |
          set -euo pipefail
          node scripts/backfill-media-category-assignments.mjs
      - name: Backfill author identities
        if: needs.firebase-preflight.outputs.functions_mutated == 'true' || contains(format(',{0},', needs.firebase-preflight.outputs.selected_migrations), ',author-profiles,')
        # Ordered after the media backfill and before the function deploy, for the
        # same reason that one is: both write Firestore through the Admin SDK, and
        # a rollout that ships the byline picker before the directory exists gives
        # every editor an empty author list and a null self credit. Idempotent --
        # it verifies existing linkage rather than reminting it -- so a rerun and
        # a redeploy are both safe. Accounts with no stored display name are
        # reported, not guessed at; supply AUTHOR_PROFILE_MAPPING and rerun to seed
        # them, or let each person's first profile visit mint their own.
        env:
          AUTHOR_PROFILE_MAPPING: ${{ vars.AUTHOR_PROFILE_MAPPING }}
        run: |
          set -euo pipefail
          node scripts/backfill-author-profiles.mjs
      - name: Seed and verify the content section registry
        if: needs.firebase-preflight.outputs.functions_mutated == 'true' || contains(format(',{0},', needs.firebase-preflight.outputs.selected_migrations), ',content-sections,')
        # A record create names a registered desk and fails closed against the live
        # `sections` collection. Functions activated before the registry exists therefore
        # refuse every record create and reject every scoped grant, so the registry has to
        # be in place before the deploy below, not after it. The script is idempotent: an
        # existing row that matches is verified and left alone, one that disagrees stops the
        # run, and it reads the registry back before it exits.
        run: node scripts/seed-content-sections.mjs
      - name: Configure functions artifact cleanup
        if: needs.firebase-preflight.outputs.functions_mutated == 'true'
        # Firebase treats a missing Artifact Registry cleanup policy as a failed
        # deploy after every function has already updated. Set the policy
        # explicitly so old build images do not accumulate charges and the
        # successful backend deploy can release the reviewed admin artifact.
        run: |
          npx --no-install firebase functions:artifacts:setpolicy \
            --project njpbs-site \
            --location us-central1 \
            --days 7 \
            --force
      - name: Check preview dependencies before ordinary Functions mutate
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true' && needs.firebase-preflight.outputs.preview_paused == 'true' && needs.firebase-preflight.outputs.preview_protocol == 'schema-one' && needs.firebase-preflight.outputs.preview_pause_late == 'true'
        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CMS_PREVIEW_R2_CREDENTIAL: ${{ secrets.CMS_PREVIEW_R2_CREDENTIAL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CMS_PREVIEW_TRANSPORT: ${{ vars.CMS_PREVIEW_TRANSPORT || 'serializer' }}
          RENDERER_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          test "$CMS_PREVIEW_TRANSPORT" = serializer
          node --import ./site/node_modules/tsx/dist/loader.mjs \
            site/scripts/deploy-cms-preview-cloud.ts preflight "$RENDERER_SHA"
      - name: Deploy Firebase rules and indexes before the preview pause
        id: deploy_rules_before_preview
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true' && needs.firebase-preflight.outputs.preview_pause_late == 'true'
        run: |
          npx --no-install firebase deploy \
            --project njpbs-site \
            --only "firestore:rules,firestore:indexes,storage" \
            --non-interactive
      - name: Deploy ordinary Functions before the preview pause
        id: deploy_functions_before_preview
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true' && needs.firebase-preflight.outputs.preview_pause_late == 'true' && needs.firebase-preflight.outputs.functions_before_preview != ''
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          FUNCTION_TARGETS: ${{ needs.smoke-manifest.outputs.function_targets }}
          CMS_FUNCTION_DEPLOY_TARGETS: ${{ needs.firebase-preflight.outputs.functions_before_preview }}
          CMS_PREVIEW_FUNCTION_TARGETS: ${{ needs.firebase-preflight.outputs.functions_during_preview }}
          CMS_FUNCTION_DEPLOY_PHASE: before-preview
          CLOUD_PUBLICATION_WAKE_ENVIRONMENT: production
          CLOUD_PUBLICATION_WAKE_ENABLED: "true"
        run: node scripts/component-runner.mjs functions deploy
      - name: Pause preview admission before the preview Functions subset
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true' && needs.firebase-preflight.outputs.preview_paused == 'true' && needs.firebase-preflight.outputs.preview_protocol == 'schema-one' && needs.firebase-preflight.outputs.preview_pause_late == 'true'
        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CMS_PREVIEW_R2_CREDENTIAL: ${{ secrets.CMS_PREVIEW_R2_CREDENTIAL }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CMS_PREVIEW_TRANSPORT: ${{ vars.CMS_PREVIEW_TRANSPORT || 'serializer' }}
          RENDERER_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
        run: |
          set -euo pipefail
          test "$CMS_PREVIEW_TRANSPORT" = serializer
          node --import ./site/node_modules/tsx/dist/loader.mjs \
            site/scripts/deploy-cms-preview-cloud.ts pause "$RENDERER_SHA"
      - name: Deploy Firebase rules, indexes, and functions
        id: deploy_functions
        if: needs.firebase-preflight.outputs.functions_mutated == 'true'
        env:
          FIRESTORE_DEPLOYED_BEFORE_PREVIEW: ${{ steps.deploy_rules_before_preview.outcome }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_FUNCTION_DEPLOY_TARGETS: ${{ vars.CMS_PREVIEW_CLOUD_ENABLED == 'true' && needs.firebase-preflight.outputs.preview_pause_late == 'true' && needs.firebase-preflight.outputs.functions_during_preview || needs.firebase-preflight.outputs.function_deploy_targets }}
          FUNCTION_TARGETS: ${{ needs.smoke-manifest.outputs.function_targets }}
          CLOUD_PUBLICATION_WAKE_ENVIRONMENT: production
          CLOUD_PUBLICATION_WAKE_ENABLED: "true"
        run: |
          set -euo pipefail
          if [[ ! "$FUNCTION_TARGETS" =~ ^functions:[A-Za-z][A-Za-z0-9]*(,functions:[A-Za-z][A-Za-z0-9]*)*$ ]]; then
            echo "The smoke-manifest job returned an invalid Firebase function target list" >&2
            exit 1
          fi
          if [ "$FIRESTORE_DEPLOYED_BEFORE_PREVIEW" != success ]; then
            npx --no-install firebase deploy --project njpbs-site \
              --only "firestore:rules,firestore:indexes,storage" --non-interactive
          fi
          node scripts/component-runner.mjs functions deploy
      - name: Check out the trusted post-deploy IAM checker
        if: needs.firebase-preflight.outputs.functions_mutated == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .cms-iam-gate
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            scripts/check-cms-secret-iam.mjs
            scripts/lib/functions-deploy-inventory.mjs
          persist-credentials: false
      - name: Isolate trusted event IAM gate
        if: needs.firebase-preflight.outputs.functions_mutated == 'true'
        run: mv .cms-iam-gate "$RUNNER_TEMP/cms-iam-gate"
      - name: Verify event trigger IAM after deployment
        if: needs.firebase-preflight.outputs.functions_mutated == 'true'
        env:
          FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
        run: node "$RUNNER_TEMP/cms-iam-gate/scripts/check-cms-secret-iam.mjs" "$GITHUB_WORKSPACE" --post-deploy

      - name: Backfill byline projections
        if: needs.firebase-preflight.outputs.functions_mutated == 'true' || contains(format(',{0},', needs.firebase-preflight.outputs.selected_migrations), ',byline-projections,')
        # Functions now maintain new writes; this pass fills every older source
        # profile, including redacted ineligible cursor rows.
        run: |
          set -euo pipefail
          node scripts/backfill-byline-projections.mjs
      - name: Verify deployed Functions configuration before completion
        if: needs.firebase-preflight.outputs.functions_mutated == 'true'
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_DEPLOYMENT_VARIABLES_JSON: ${{ toJSON(vars) }}
          VITE_CMS_STUDIO_CONFIGURATION: ${{ secrets.VITE_CMS_STUDIO_CONFIGURATION }}
          VITE_LIVE_PRODUCTION_ENABLED: ${{ vars.LIVE_PRODUCTION_ENABLED || 'false' }}
          CMS_ADMIN_BUILD_REVISION: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_PREVIEW_RENDERER_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CMS_BUG_REPORT_TELEGRAM_CHAT_ID: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_CHAT_ID }}
          CMS_BUG_REPORT_TELEGRAM_ADMIN_MAP: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_ADMIN_MAP }}
          FIREBASE_DEPLOY_SERVICE_ACCOUNT: ${{ vars.FIREBASE_DEPLOY_SERVICE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CMS_BUG_REPORT_GITHUB_TOKEN: ${{ secrets.CMS_BUG_REPORT_GITHUB_TOKEN }}
          CMS_BUG_REPORT_GITHUB_WEBHOOK_SECRET: ${{ secrets.CMS_BUG_REPORT_GITHUB_WEBHOOK_SECRET }}
          CMS_BUG_REPORT_TELEGRAM_BOT_TOKEN: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_BOT_TOKEN }}
          CMS_BUG_REPORT_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_WEBHOOK_SECRET }}
          CMS_EDGE_ORIGIN_SECRET: ${{ secrets.CMS_EDGE_ORIGIN_SECRET }}
          CMS_MEDIA_CACHE_PURGE_TOKEN: ${{ secrets.CMS_MEDIA_CACHE_PURGE_TOKEN }}
          CMS_STAFF_EMAIL_API_TOKEN: ${{ secrets.CMS_STAFF_EMAIL_API_TOKEN }}
          CMS_VOICEOVER_R2_ACCESS_KEY_ID: ${{ secrets.CMS_VOICEOVER_R2_ACCESS_KEY_ID }}
          CMS_VOICEOVER_R2_SECRET_ACCESS_KEY: ${{ secrets.CMS_VOICEOVER_R2_SECRET_ACCESS_KEY }}
          CMS_PUBLISH_GITHUB_TOKEN_PROVISIONING: ${{ secrets.CMS_PUBLISH_GITHUB_TOKEN_PROVISIONING }}
        run: node scripts/component-runner.mjs functions verify-deployed-config
      - name: Record the completed Functions receipt
        if: needs.firebase-preflight.outputs.functions_mutated == 'true' && !inputs.install_reader_bridge
        env:
          FUNCTIONS_CONFIGURATION_FINGERPRINT: ${{ needs.firebase-preflight.outputs.functions_configuration_fingerprint }}
          FUNCTIONS_VARIABLES_FINGERPRINT: ${{ needs.firebase-preflight.outputs.functions_variables_fingerprint }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          FUNCTION_TARGETS: ${{ needs.smoke-manifest.outputs.function_targets }}
        run: |
          set -euo pipefail
          node scripts/component-runner.mjs functions complete \
            --source-sha "$DEPLOY_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --configuration-fingerprint "$FUNCTIONS_CONFIGURATION_FINGERPRINT" \
            --variables-fingerprint "$FUNCTIONS_VARIABLES_FINGERPRINT" \
            --live
      - name: Verify and record the original production Functions reader
        if: inputs.install_reader_bridge
        env:
          CMS_PRODUCTION_INSTALL_READER_BRIDGE: ${{ inputs.install_reader_bridge }}
          CMS_PRODUCTION_READER_OPERATION_ID: ${{ inputs.reader_operation_id }}
          CMS_PRODUCTION_READER_INSTALL_AUTHORIZATION: ${{ inputs.reader_install_authorization }}
          CMS_DEPLOYMENT_ENVIRONMENT: production
          FIREBASE_PROJECT_ID: njpbs-site
          FORCE_FIREBASE: ${{ inputs.force_firebase }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/production-reader-deployment.mjs complete functions
      - name: Verify live Functions inventory without mutating
        if: needs.firebase-preflight.outputs.functions_mutated != 'true'
        env:
          FUNCTION_TARGETS: ${{ needs.smoke-manifest.outputs.function_targets }}
          CLOUD_PUBLICATION_WAKE_ENVIRONMENT: production
          CLOUD_PUBLICATION_WAKE_ENABLED: "true"
        run: node scripts/component-runner.mjs functions verify
      - name: Deploy Firestore and Storage rules without Functions
        if: needs.firebase-preflight.outputs.functions_mutated != 'true'
        run: |
          npx --no-install firebase deploy \
            --only firestore:rules,firestore:indexes,storage \
            --project njpbs-site \
            --non-interactive
      - name: Recheck live Functions identity before Admin
        if: needs.firebase-preflight.outputs.functions_mutated != 'true'
        env:
          LIVE_FUNCTIONS_SHA: ${{ needs.firebase-preflight.outputs.live_functions_sha }}
        run: node scripts/component-runner.mjs functions confirm --source-sha "$LIVE_FUNCTIONS_SHA"
      - name: Backfill and verify private media discovery
        # Composite indexes and all canonical writers are deployed before readiness.
        # The Admin deploy waits for this checkpoint and the live index probes.
        env:
          MEDIA_DISCOVERY_SOURCE_SHA: ${{ needs.firebase-preflight.outputs.functions_mutated == 'true' && needs.admin-build.outputs.deploy_sha || needs.firebase-preflight.outputs.live_functions_sha }}
        run: |
          set -euo pipefail
          node scripts/backfill-media-discovery.mjs --apply --project njpbs-site --source-sha "$MEDIA_DISCOVERY_SOURCE_SHA" < "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Restore the last complete Functions receipt if no mutation began
        # Both Functions deploy phases must be skipped before abandoning the
        # reservation. A success, failure or cancellation in either phase
        # may have mutated live Functions; retain the in_progress receipt
        # for paired recovery in that case. Earlier steps may already have run
        # idempotent data backfills; the receipt records deployed Functions
        # source only, and the next release of this commit repeats them.
        # The renderer receipt is left in_progress on purpose: preview may be
        # paused, or ordinary Functions may have changed before the late pause.
        # A new paired release, selected
        # by completed-run recovery or force_firebase, resumes it.
        if: failure() && github.run_attempt == 1 && needs.firebase-preflight.outputs.functions_mutated == 'true' && steps.deploy_functions.outcome == 'skipped' && steps.deploy_functions_before_preview.outcome == 'skipped'
        run: |
          node scripts/component-runner.mjs functions abandon \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Clean up Firebase credentials
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-service-account.json" functions/.env.njpbs-site

  preview-renderer:
    env:
      CMS_DEPLOY_OWNER: ${{ vars.CMS_DEPLOY_OWNER }}
    needs: [admin-build, firebase, firebase-preflight]
    environment: production
    if: >-
      (vars.CANONICAL_GITHUB_REPOSITORY != '' && vars.CANONICAL_GITHUB_REPOSITORY_ID != '' && github.repository == vars.CANONICAL_GITHUB_REPOSITORY && github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID) &&
      (vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER) && github.ref == 'refs/heads/main'
    # Wrangler builds the renderer container image and needs a Docker engine.
    runs-on: ubuntu-24.04
    # Allow all three wait limits plus setup and image deployment.
    timeout-minutes: 60 # Runaway guard: 3x max rounds to 48m; preserve 55m waits plus setup (#2657).
    steps:
      - uses: actions/checkout@v7
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true'
        with:
          ref: ${{ needs.admin-build.outputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out trusted release source gate
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .release-gate
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Isolate trusted release-gate checkout
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true'
        run: |
          set -euo pipefail
          mv .release-gate "$RUNNER_TEMP/release-gate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/release-gate/node_modules"
      - name: Require reviewed renderer source
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true'
        env:
          EMERGENCY_RELEASE: ${{ inputs.emergency_release || false }}
          EMERGENCY_AUTHORIZATION: ${{ inputs.emergency_authorization || '' }}
        run: node "$RUNNER_TEMP/release-gate"/.github/scripts/require-release-source.mjs
      - name: Check out current metered-API scanner
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true'
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .metered-api-gate
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Isolate trusted metered-api-gate checkout
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true'
        run: |
          set -euo pipefail
          mv .metered-api-gate "$RUNNER_TEMP/metered-api-gate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/metered-api-gate/node_modules"
      - name: Require pinned release and trusted workflow identities
        env:
          CMS_RELEASE_CHECKS_SHA: ${{ inputs.deploy_ref }}
          CMS_TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true'
        run: node "$RUNNER_TEMP/release-gate"/.github/scripts/require-cms-release-sources.mjs
      - name: Metered-API source scan (before any scanned code runs)
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true'
        run: node "$RUNNER_TEMP/metered-api-gate"/.github/scripts/metered-api-scan.mjs --target-root "$GITHUB_WORKSPACE"
      - name: Check out trusted configuration renderer
        uses: actions/checkout@v7
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true'
        with:
          ref: ${{ github.sha }}
          path: .configuration-render-gate
          persist-credentials: false
          sparse-checkout: |
            scripts/render-development-config.mjs
            config/development-inputs.json
          sparse-checkout-cone-mode: false
      - name: Render deployment resource configuration
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true'
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mv .configuration-render-gate "$RUNNER_TEMP/configuration-render-gate"
          node "$RUNNER_TEMP/configuration-render-gate/scripts/render-development-config.mjs" --production --root "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true'
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json
      - name: Install release dependencies
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true'
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm --prefix site ci --ignore-scripts --no-audit --no-fund
      - name: Mark the renderer receipt in progress
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true' && needs.firebase-preflight.outputs.preview_paused == 'true'
        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          RENDERER_INPUT_FINGERPRINT: ${{ needs.firebase-preflight.outputs.renderer_input_fingerprint }}
        run: |
          node scripts/component-runner.mjs renderer start \
            --source-sha "$DEPLOY_SHA" \
            --input-fingerprint "$RENDERER_INPUT_FINGERPRINT" \
            --trusted-workflow-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"
      - name: Deploy and verify the matched cloud preview renderer
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true' && needs.firebase-preflight.outputs.preview_paused == 'true'
        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CMS_PREVIEW_R2_CREDENTIAL: ${{ secrets.CMS_PREVIEW_R2_CREDENTIAL }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          RENDERER_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
        run: |
          node --import ./site/node_modules/tsx/dist/loader.mjs \
            site/scripts/deploy-cms-preview-cloud.ts deploy "$RENDERER_SHA"
      - name: Record the completed renderer receipt
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true' && needs.firebase-preflight.outputs.preview_paused == 'true'
        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
        run: |
          node scripts/component-runner.mjs renderer complete \
            --source-sha "$DEPLOY_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --live

      - name: Confirm the live renderer is ready
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true' && needs.firebase-preflight.outputs.preview_paused != 'true'
        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RENDERER_TARGET_SHA: ${{ needs.firebase-preflight.outputs.renderer_target_sha }}
        run: node scripts/component-runner.mjs renderer confirm --source-sha "$RENDERER_TARGET_SHA"

  live-smoke:
    env:
      CMS_DEPLOY_OWNER: ${{ vars.CMS_DEPLOY_OWNER }}
    needs: [admin-build, firebase, admin-deploy]
    environment: production
    if: >-
      (vars.CANONICAL_GITHUB_REPOSITORY != '' && vars.CANONICAL_GITHUB_REPOSITORY_ID != '' && github.repository == vars.CANONICAL_GITHUB_REPOSITORY && github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID) &&
      (vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER) && github.ref == 'refs/heads/main'
    # Older release boot configs select installed Chrome on hosted runners.
    runs-on: ubuntu-24.04
    timeout-minutes: 24 # Runaway guard: 3x max 7m44s (14d, 2026-10-26; #2657).
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admin-build.outputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out the exact CMS smoke gate source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .cms-smoke-gate
          persist-credentials: false
      - name: Isolate trusted cms-smoke-gate checkout
        run: |
          set -euo pipefail
          mv .cms-smoke-gate "$RUNNER_TEMP/cms-smoke-gate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/cms-smoke-gate/node_modules"
      - name: Require pinned release and trusted workflow identities
        env:
          CMS_RELEASE_CHECKS_SHA: ${{ inputs.deploy_ref }}
          CMS_TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: node "$RUNNER_TEMP/cms-smoke-gate"/.github/scripts/require-cms-release-sources.mjs
      - name: Metered-API source scan (before any scanned code runs)
        run: node "$RUNNER_TEMP/cms-smoke-gate"/.github/scripts/metered-api-scan.mjs --target-root "$GITHUB_WORKSPACE"
      - name: Check out trusted configuration renderer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .configuration-render-gate
          persist-credentials: false
          sparse-checkout: |
            scripts/render-development-config.mjs
            config/development-inputs.json
          sparse-checkout-cone-mode: false
      - name: Render deployment resource configuration
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mv .configuration-render-gate "$RUNNER_TEMP/configuration-render-gate"
          node "$RUNNER_TEMP/configuration-render-gate/scripts/render-development-config.mjs" --production --root "$GITHUB_WORKSPACE"
      - name: Metered-API source scan for current CMS smoke gate
        working-directory: ${{ runner.temp }}/cms-smoke-gate
        run: node .github/scripts/metered-api-scan.mjs
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
      - name: Install singleton contract dependencies before credentials
        run: |
          npm ci --ignore-scripts
          npm --prefix site ci --ignore-scripts --no-audit --no-fund
      - name: Download the sanitized singleton contract summary
        uses: actions/download-artifact@v8
        with:
          name: cms-public-contract-before-upload
          path: ${{ runner.temp }}/cms-contract-proof
      - name: Prepare the singleton contract runtime before credentials
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
        run: >-
          node --import ./site/node_modules/tsx/dist/loader.mjs "$RUNNER_TEMP/cms-smoke-gate/scripts/check-cms-public-contract.mjs" prepare
          --environment production --candidate "$DEPLOY_SHA" --source-root "$GITHUB_WORKSPACE"
          --state-directory "$RUNNER_TEMP/cms-public-contract-private" --previous-summary "$RUNNER_TEMP/cms-contract-proof/cms-public-contract-summary-before-upload.json"
      - name: Smoke-test deployed CMS boundaries
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          VITE_FUNCTIONS_BASE_URL: ${{ vars.VITE_FUNCTIONS_BASE_URL || secrets.VITE_FUNCTIONS_BASE_URL }}
        run: node scripts/component-runner.mjs functions smoke
      - name: Install Admin boot smoke dependencies from the exact release source
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --workspace njpbs-admin --include-workspace-root=false
      - name: Ensure supported sandboxed Chrome for the live Admin boot check
        timeout-minutes: 15
        run: node "$RUNNER_TEMP/cms-smoke-gate"/.github/scripts/ensure-panel-browser-deps.mjs
      - name: Smoke-test the deployed signed-out Admin shell
        env:
          ADMIN_BOOT_URL: https://admin.njpbs.org/
        run: npm run test:boot -w njpbs-admin
      - name: Verify the singleton public contract at settlement
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          node --import ./site/node_modules/tsx/dist/loader.mjs "$RUNNER_TEMP/cms-smoke-gate/scripts/check-cms-public-contract.mjs" prove \
            --environment production --boundary settlement --candidate "$DEPLOY_SHA" --source-root "$GITHUB_WORKSPACE" \
            --summary "$RUNNER_TEMP/cms-public-contract-summary-settlement.json" \
            --state-directory "$RUNNER_TEMP/cms-public-contract-private" --previous-summary "$RUNNER_TEMP/cms-contract-proof/cms-public-contract-summary-before-upload.json"
      - name: Retain only the sanitized singleton contract summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cms-public-contract-settlement-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cms-public-contract-summary-settlement.json
          if-no-files-found: error
      - name: Remove private singleton contract inputs and processes
        if: always()
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker ps --all --quiet --filter "label=njpbs.cms-contract=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB")
          if [ "${#containers[@]}" -gt 0 ]; then docker rm --force "${containers[@]}"; fi
          sudo rm -rf -- "$RUNNER_TEMP/cms-public-contract-private"

  admin-deploy:
    env:
      CMS_DEPLOY_OWNER: ${{ vars.CMS_DEPLOY_OWNER }}
    needs: [admin-build, cms-api, firebase, preview-renderer, firebase-preflight, admin-contract]
    environment: production
    if: >-
      (vars.CANONICAL_GITHUB_REPOSITORY != '' && vars.CANONICAL_GITHUB_REPOSITORY_ID != '' && github.repository == vars.CANONICAL_GITHUB_REPOSITORY && github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID) &&
      (vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER) && github.ref == 'refs/heads/main'
    # Deploy credentials must not share PR slots or their writable disk.
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # Runaway guard: 3x max rounds to 8m; retain 20m floor (#2657).
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admin-build.outputs.deploy_sha }}
          persist-credentials: false
      - name: Check out current metered-API scanner
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .metered-api-gate
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Isolate trusted metered-api-gate checkout
        run: |
          set -euo pipefail
          mv .metered-api-gate "$RUNNER_TEMP/metered-api-gate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/metered-api-gate/node_modules"
      - name: Require pinned release and trusted workflow identities
        env:
          CMS_RELEASE_CHECKS_SHA: ${{ inputs.deploy_ref }}
          CMS_TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: node "$RUNNER_TEMP/metered-api-gate"/.github/scripts/require-cms-release-sources.mjs
      - name: Check out trusted configuration renderer
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .configuration-render-gate
          persist-credentials: false
          sparse-checkout: |
            scripts/render-development-config.mjs
            config/development-inputs.json
          sparse-checkout-cone-mode: false
      - name: Render deployment resource configuration
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mv .configuration-render-gate "$RUNNER_TEMP/configuration-render-gate"
          node "$RUNNER_TEMP/configuration-render-gate/scripts/render-development-config.mjs" --production --root "$GITHUB_WORKSPACE"
      - name: Metered-API source scan (before any scanned code runs)
        run: node "$RUNNER_TEMP/metered-api-gate"/.github/scripts/metered-api-scan.mjs --target-root "$GITHUB_WORKSPACE"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps
        run: npm ci --ignore-scripts
      - name: Recheck live Functions identity before Admin upload
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/firebase-service-account.json
          LIVE_FUNCTIONS_SHA: ${{ needs.firebase-preflight.outputs.functions_mutated == 'true' && needs.admin-build.outputs.deploy_sha || needs.firebase-preflight.outputs.live_functions_sha }}
        run: |
          set -euo pipefail
          : "${LIVE_FUNCTIONS_SHA:?Expected Functions source SHA is required before Admin upload}"
          # The live Functions inventory uses ADC. Keep its file inside this step.
          trap 'rm -f "$GOOGLE_APPLICATION_CREDENTIALS"' EXIT
          umask 077
          printf '%s' "$SA" > "$GOOGLE_APPLICATION_CREDENTIALS"
          node scripts/component-runner.mjs functions confirm --source-sha "$LIVE_FUNCTIONS_SHA"
      - name: Recheck live renderer identity before Admin upload
        if: vars.CMS_PREVIEW_CLOUD_ENABLED == 'true'
        env:
          CMS_PREVIEW_FIREBASE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RENDERER_TARGET_SHA: ${{ needs.firebase-preflight.outputs.renderer_target_sha }}
        run: |
          set -euo pipefail
          : "${RENDERER_TARGET_SHA:?Expected renderer source SHA is required before Admin upload}"
          node scripts/component-runner.mjs renderer confirm --source-sha "$RENDERER_TARGET_SHA"
      - name: Download admin artifact
        uses: actions/download-artifact@v8
        with:
          name: cms-staging-admin
          path: admin/dist
      - name: Validate Cloudflare Pages branch
        id: pages_branch
        shell: bash
        env:
          CLOUDFLARE_PAGES_BRANCH: ${{ inputs.cloudflare_pages_branch }}
        run: |
          set -euo pipefail
          if [[ ! "$CLOUDFLARE_PAGES_BRANCH" =~ ^[A-Za-z0-9][A-Za-z0-9._/-]{0,127}$ ]] \
            || [[ "$CLOUDFLARE_PAGES_BRANCH" == *".."* ]]; then
            echo "::error::cloudflare_pages_branch contains unsupported characters."
            exit 1
          fi
          echo "value=$CLOUDFLARE_PAGES_BRANCH" >> "$GITHUB_OUTPUT"
      - name: Verify the private guide boundary before Admin upload
        if: hashFiles('admin/dist/guide-content/manifest.json') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-admin-pages-security.mjs predeploy
      - name: Download the sanitized singleton contract summary
        uses: actions/download-artifact@v8
        with:
          name: cms-public-contract-before-upload
          path: ${{ runner.temp }}/cms-contract-proof
      - name: Require the before-upload proof for this exact Admin artifact
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          PROVED_ADMIN_DIGEST: ${{ needs.admin-contract.outputs.admin_digest }}
          PROVED_RUN_ID: ${{ needs.admin-contract.outputs.proof_run_id }}
          PROVED_RUN_ATTEMPT: ${{ needs.admin-contract.outputs.proof_run_attempt }}
        run: |
          set -euo pipefail
          # A rerun of this job alone reuses an earlier attempt's proof, so rerun admin-contract with it.
          test "$PROVED_RUN_ID" = "$GITHUB_RUN_ID"
          test "$PROVED_RUN_ATTEMPT" = "$GITHUB_RUN_ATTEMPT"
          digest="$(find admin/dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d" " -f1)"
          test -n "$PROVED_ADMIN_DIGEST"
          test "$digest" = "$PROVED_ADMIN_DIGEST"
          # Capture and replay take at most one 240 s contract budget. The handoff to this step took
          # 60-106 s in six production deploys (Nov. 2-7, 2026), so a second budget bounds it.
          node -e 'const s = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")); const age = Date.now() - s.capturedAt;
            if (s.candidateSha !== process.env.DEPLOY_SHA || !Number.isSafeInteger(s.capturedAt) || age < 0 || age >= 480000) process.exit(1)' \
            "$RUNNER_TEMP/cms-contract-proof/cms-public-contract-summary-before-upload.json"
      - name: Deploy edge-based admin Pages project
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: admin
          wranglerVersion: "4.134.0"
          command: pages deploy dist --project-name=njpbs-admin --branch=${{ steps.pages_branch.outputs.value }}
      - name: Open only the Admin authentication shell
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CMS_ADMIN_ACCESS_API_TOKEN }}
        run: node scripts/configure-admin-public-shell.mjs
      - name: Confirm the live Admin revision matches this deploy
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
        run: node scripts/confirm-admin-revision.mjs
      - name: Verify the private guide boundary after Admin upload
        if: hashFiles('admin/dist/guide-content/manifest.json') != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: node scripts/check-admin-pages-security.mjs postdeploy

  admin-contract:
    env:
      CMS_DEPLOY_OWNER: ${{ vars.CMS_DEPLOY_OWNER }}
    needs: [admin-build, cms-api, firebase, preview-renderer, firebase-preflight]
    environment: production
    if: >-
      (vars.CANONICAL_GITHUB_REPOSITORY != '' && vars.CANONICAL_GITHUB_REPOSITORY_ID != '' && github.repository == vars.CANONICAL_GITHUB_REPOSITORY && github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID) &&
      (vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER) && github.ref == 'refs/heads/main'
    # The before-upload proof needs job ADC, so it runs apart from the Admin upload's Cloudflare tools.
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # Runaway guard: two bounded four-minute captures plus setup.
    outputs:
      admin_digest: ${{ steps.admin_digest.outputs.value }}
      proof_run_id: ${{ steps.admin_digest.outputs.run_id }}
      proof_run_attempt: ${{ steps.admin_digest.outputs.run_attempt }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.admin-build.outputs.deploy_sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Check out current metered-API scanner
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .metered-api-gate
          sparse-checkout: .github/scripts
          persist-credentials: false
      - name: Isolate trusted metered-API scanner
        run: |
          set -euo pipefail
          mv .metered-api-gate "$RUNNER_TEMP/metered-api-gate"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/metered-api-gate/node_modules"
      - name: Require pinned release and trusted workflow identities
        env:
          CMS_RELEASE_CHECKS_SHA: ${{ inputs.deploy_ref }}
          CMS_TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: node "$RUNNER_TEMP/metered-api-gate"/.github/scripts/require-cms-release-sources.mjs
      - name: Metered-API source scan (before any scanned code runs)
        run: node "$RUNNER_TEMP/metered-api-gate"/.github/scripts/metered-api-scan.mjs --target-root "$GITHUB_WORKSPACE"
      - name: Check out trusted singleton contract source
        uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          path: .cms-contract-source
          persist-credentials: false
      - name: Isolate trusted singleton contract source
        run: |
          set -euo pipefail
          mv .cms-contract-source "$RUNNER_TEMP/cms-contract-source"
      - name: Metered-API source scan for the singleton checker
        run: node "$RUNNER_TEMP/metered-api-gate"/.github/scripts/metered-api-scan.mjs --target-root "$RUNNER_TEMP/cms-contract-source"
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install workspace deps
        run: |
          npm ci --ignore-scripts
          npm --prefix site ci --ignore-scripts --no-audit --no-fund
      - name: Download admin artifact
        uses: actions/download-artifact@v8
        with:
          name: cms-staging-admin
          path: admin/dist
      - name: Record the proved Admin artifact digest
        id: admin_digest
        run: |
          set -euo pipefail
          digest="$(find admin/dist -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d" " -f1)"
          echo "value=$digest" >> "$GITHUB_OUTPUT"
          echo "run_id=$GITHUB_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "run_attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
      - name: Download the sanitized singleton contract summary
        uses: actions/download-artifact@v8
        with:
          name: cms-public-contract-preflight
          path: ${{ runner.temp }}/cms-contract-proof
      - name: Prepare the singleton contract runtime before credentials
        env:
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
        run: >-
          node --import ./site/node_modules/tsx/dist/loader.mjs "$RUNNER_TEMP/cms-contract-source/scripts/check-cms-public-contract.mjs" prepare
          --environment production --candidate "$DEPLOY_SHA" --source-root "$GITHUB_WORKSPACE"
          --state-directory "$RUNNER_TEMP/cms-public-contract-private" --previous-summary "$RUNNER_TEMP/cms-contract-proof/cms-public-contract-summary-preflight.json"
      - name: Authenticate Firebase deploy service account
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          project_id: njpbs-site
      - name: Verify the singleton public contract at before-upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ needs.admin-build.outputs.deploy_sha }}
          CMS_BUG_REPORT_TELEGRAM_CHAT_ID: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_CHAT_ID }}
          CMS_BUG_REPORT_TELEGRAM_ADMIN_MAP: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_ADMIN_MAP }}
          CMS_DEPLOYMENT_VARIABLES_JSON: ${{ toJSON(vars) }}
          CMS_MEDIA_CACHE_PURGE_TOKEN: ${{ secrets.CMS_MEDIA_CACHE_PURGE_TOKEN }}
          CMS_VOICEOVER_R2_ACCESS_KEY_ID: ${{ secrets.CMS_VOICEOVER_R2_ACCESS_KEY_ID }}
          CMS_VOICEOVER_R2_SECRET_ACCESS_KEY: ${{ secrets.CMS_VOICEOVER_R2_SECRET_ACCESS_KEY }}
          CMS_STAFF_EMAIL_API_TOKEN: ${{ secrets.CMS_STAFF_EMAIL_API_TOKEN }}
          CMS_BUG_REPORT_TELEGRAM_BOT_TOKEN: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_BOT_TOKEN }}
          CMS_BUG_REPORT_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_WEBHOOK_SECRET }}
          CMS_BUG_REPORT_GITHUB_TOKEN: ${{ secrets.CMS_BUG_REPORT_GITHUB_TOKEN }}
          CMS_BUG_REPORT_GITHUB_WEBHOOK_SECRET: ${{ secrets.CMS_BUG_REPORT_GITHUB_WEBHOOK_SECRET }}
          CMS_PUBLISH_GITHUB_TOKEN_PROVISIONING: ${{ secrets.CMS_PUBLISH_GITHUB_TOKEN_PROVISIONING }}
          FORCE_FIREBASE: ${{ inputs.force_firebase }}
          CMS_EDGE_ORIGIN_SECRET: ${{ secrets.CMS_EDGE_ORIGIN_SECRET }}
          CLOUD_PUBLICATION_WAKE_ENVIRONMENT: production
          CLOUD_PUBLICATION_WAKE_ENABLED: "true"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          FIREBASE_WEB_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY || secrets.VITE_FIREBASE_API_KEY }}
          CMS_PREVIEW_R2_CREDENTIAL: ${{ secrets.CMS_PREVIEW_R2_CREDENTIAL }}
          CMS_TRUSTED_WORKFLOW_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          umask 077
          node --import ./site/node_modules/tsx/dist/loader.mjs "$RUNNER_TEMP/cms-contract-source/scripts/check-cms-public-contract.mjs" prove \
            --environment production --boundary before-upload --candidate "$DEPLOY_SHA" --source-root "$GITHUB_WORKSPACE" \
            --summary "$RUNNER_TEMP/cms-public-contract-summary-before-upload.json" \
            --state-directory "$RUNNER_TEMP/cms-public-contract-private" --previous-summary "$RUNNER_TEMP/cms-contract-proof/cms-public-contract-summary-preflight.json" 4<<< "$CMS_PREVIEW_R2_CREDENTIAL"
      - name: Retain only the sanitized singleton contract summary
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cms-public-contract-before-upload
          path: ${{ runner.temp }}/cms-public-contract-summary-before-upload.json
          if-no-files-found: error
          overwrite: true
      - name: Remove private singleton contract inputs and processes
        if: always()
        run: |
          set -euo pipefail
          mapfile -t containers < <(docker ps --all --quiet --filter "label=njpbs.cms-contract=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-$GITHUB_JOB")
          if [ "${#containers[@]}" -gt 0 ]; then docker rm --force "${containers[@]}"; fi
          sudo rm -rf -- "$RUNNER_TEMP/cms-public-contract-private"
