name: Promote production
run-name: Promote ${{ inputs.target || 'production' }} ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full main commit SHA to promote
        required: true
        type: string
      target:
        description: Branch and environment to promote
        required: false
        default: production
        type: choice
        options:
          - production
          - development

permissions:
  contents: read
  actions: read

concurrency:
  group: promote-${{ inputs.target || 'production' }}
  cancel-in-progress: false

env:
  CANONICAL_GITHUB_REPOSITORY: ${{ vars.CANONICAL_GITHUB_REPOSITORY }}
  CANONICAL_GITHUB_REPOSITORY_ID: ${{ vars.CANONICAL_GITHUB_REPOSITORY_ID }}

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.CANONICAL_GITHUB_REPOSITORY != '' &&
      vars.CANONICAL_GITHUB_REPOSITORY_ID != '' &&
      github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID &&
      github.workflow_ref == format('{0}/.github/workflows/promote.yml@refs/heads/main', vars.CANONICAL_GITHUB_REPOSITORY) &&
      vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER &&
      inputs.target != 'development'
    environment: production
    runs-on: ubuntu-24.04
    # Stops a hung promote. Measured 14 s, 15 s (45163409825, 45127688727).
    timeout-minutes: 5
    steps:
      - name: Validate the selected SHA
        env:
          SELECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full lowercase main SHA is required'; exit 1; }
      - name: Create repository-scoped promotion token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.CCM_PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CCM_PROMOTE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
      - name: Check out the trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require main ancestry and an existing production branch
        env:
          SELECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/production:refs/remotes/origin/production
          git merge-base --is-ancestor "$SELECTED_SHA" origin/main
          git merge-base --is-ancestor origin/production "$SELECTED_SHA"
      - name: Require successful main CI for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ inputs.sha }}
        run: node .github/scripts/require-main-ci.mjs
      - name: Fast-forward production
        env:
          SELECTED_SHA: ${{ inputs.sha }}
        run: git push origin "$SELECTED_SHA:refs/heads/production"

  promote-development:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.CANONICAL_GITHUB_REPOSITORY != '' &&
      vars.CANONICAL_GITHUB_REPOSITORY_ID != '' &&
      github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID &&
      github.workflow_ref == format('{0}/.github/workflows/promote.yml@refs/heads/main', vars.CANONICAL_GITHUB_REPOSITORY) &&
      vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER &&
      inputs.target == 'development'
    environment: development
    runs-on: ubuntu-24.04
    # Stops a hung promote. Measured 15 s (dev 45315410286).
    timeout-minutes: 5
    # A trial reads its pull request and review statuses.
    permissions:
      contents: read
      actions: read
      pull-requests: read
      statuses: read
    steps:
      - name: Validate the selected SHA
        env:
          SELECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full lowercase main SHA is required'; exit 1; }
      - name: Create repository-scoped promotion token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.CCM_PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CCM_PROMOTE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
      - name: Check out the trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Classify the selected SHA and read the development tip
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          SELECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/development:refs/remotes/origin/development
          echo "development_tip=$(git rev-parse --verify origin/development^{commit})" >> "$GITHUB_OUTPUT"
          if git merge-base --is-ancestor "$SELECTED_SHA" origin/main 2>/dev/null; then
            echo "kind=main" >> "$GITHUB_OUTPUT"
          else
            # A development trial: the exact reviewed head of an open pull request into main.
            node .github/scripts/require-reviewed-dev-source.mjs "$SELECTED_SHA"
            git fetch --no-tags origin "$SELECTED_SHA"
            echo "kind=pr_head" >> "$GITHUB_OUTPUT"
          fi
          # Only a trial leaves development outside main's history.
          if git merge-base --is-ancestor origin/development origin/main; then
            echo "trial_tip=false" >> "$GITHUB_OUTPUT"
          else
            echo "trial_tip=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Require development to move forward
        if: steps.source.outputs.kind == 'main' && steps.source.outputs.trial_tip == 'false'
        env:
          SELECTED_SHA: ${{ inputs.sha }}
        run: git merge-base --is-ancestor origin/development "$SELECTED_SHA"
      - name: Require successful main CI for this SHA
        if: steps.source.outputs.kind == 'main'
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ inputs.sha }}
        run: node .github/scripts/require-main-ci.mjs
      - name: Move development
        env:
          SELECTED_SHA: ${{ inputs.sha }}
          DEVELOPMENT_TIP: ${{ steps.source.outputs.development_tip }}
        run: |
          set -euo pipefail
          [[ "$DEVELOPMENT_TIP" =~ ^[0-9a-f]{40}$ ]]
          # A trial or a return from one may rewind development; the lease
          # holds the tip read above, and only refs/heads/development moves.
          git push --force-with-lease="refs/heads/development:$DEVELOPMENT_TIP" origin "$SELECTED_SHA:refs/heads/development"
