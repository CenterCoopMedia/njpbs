name: Promote production
run-name: Promote ${{ inputs.target || 'production' }} ${{ inputs.sha }}

on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full main commit SHA to promote
        required: true
        type: string
      target:
        description: Branch and environment to promote
        required: false
        default: production
        type: choice
        options:
          - production
          - development

permissions:
  contents: read
  actions: read

concurrency:
  group: promote-${{ inputs.target || 'production' }}
  cancel-in-progress: false

env:
  CANONICAL_GITHUB_REPOSITORY: ${{ vars.CANONICAL_GITHUB_REPOSITORY }}
  CANONICAL_GITHUB_REPOSITORY_ID: ${{ vars.CANONICAL_GITHUB_REPOSITORY_ID }}

jobs:
  promote:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      github.ref == 'refs/heads/main' &&
      vars.CANONICAL_GITHUB_REPOSITORY != '' &&
      vars.CANONICAL_GITHUB_REPOSITORY_ID != '' &&
      github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID &&
      github.workflow_ref == format('{0}/.github/workflows/promote.yml@refs/heads/main', vars.CANONICAL_GITHUB_REPOSITORY) &&
      vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER &&
      inputs.target != 'development'
    environment: production
    runs-on: ubuntu-24.04
    # Stops a hung promote. Measured 14 s, 15 s (45163409825, 45127688727).
    steps:
      - name: Validate the selected SHA
        env:
          SELECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full lowercase main SHA is required'; exit 1; }
      - name: Create repository-scoped promotion token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.CCM_PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CCM_PROMOTE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
      - name: Check out the trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Require main ancestry and an existing production branch
        env:
          SELECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main +refs/heads/production:refs/remotes/origin/production
          git merge-base --is-ancestor "$SELECTED_SHA" origin/main
          git merge-base --is-ancestor origin/production "$SELECTED_SHA"
      - name: Require successful main CI for this SHA
        env:
          GH_TOKEN: ${{ github.token }}
          DEPLOY_SHA: ${{ inputs.sha }}
        run: node .github/scripts/require-main-ci.mjs
      - name: Fast-forward production
        env:
          SELECTED_SHA: ${{ inputs.sha }}
        run: git push origin "$SELECTED_SHA:refs/heads/production"

  promote-development:
    if: >-
      github.event_name == 'workflow_dispatch' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/release-run-site') &&
      vars.CANONICAL_GITHUB_REPOSITORY != '' &&
      vars.CANONICAL_GITHUB_REPOSITORY_ID != '' &&
      github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID &&
      github.workflow_ref == format('{0}/.github/workflows/promote.yml@{1}', vars.CANONICAL_GITHUB_REPOSITORY, github.ref) &&
      vars.CMS_DEPLOY_OWNER != '' && github.triggering_actor == vars.CMS_DEPLOY_OWNER &&
      inputs.target == 'development'
    environment: development
    runs-on: ubuntu-24.04
    # Stops a hung promote. Measured 15 s (dev 45315410286).
    steps:
      - name: Validate the selected SHA
        env:
          SELECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          [[ "$SELECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo 'A full lowercase commit SHA is required'; exit 1; }
      - name: Create repository-scoped promotion token
        id: app
        uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3
        with:
          client-id: ${{ vars.CCM_PROMOTE_APP_CLIENT_ID }}
          private-key: ${{ secrets.CCM_PROMOTE_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-workflows: write
      - name: Check out the trusted workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          token: ${{ steps.app.outputs.token }}
          ref: ${{ github.sha }}
          fetch-depth: 0
      # Development takes any commit of this repository: no main history, no
      # main CI and no forward rule (the release run records those facts).
      - name: Require the commit and an existing development branch
        env:
          SELECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/development:refs/remotes/origin/development
          git fetch --no-tags origin "$SELECTED_SHA"
          git cat-file -e "$SELECTED_SHA^{commit}"
      - name: Move development
        env:
          SELECTED_SHA: ${{ inputs.sha }}
        run: |
          set -euo pipefail
          tip=$(git rev-parse refs/remotes/origin/development)
          git push --force-with-lease="refs/heads/development:$tip" origin "$SELECTED_SHA:refs/heads/development"
