name: Report relay check

# Read-only check of the staff bug-report relay bot: configured identity, long
# polling, and private recipient. It sends no message. A failure here means
# staff reports may not reach Telegram; it never blocks a CMS deploy (#537).
on:
  schedule:
    - cron: "17 11 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-relay-check
  cancel-in-progress: true

jobs:
  verify:
    # The relay secrets live in the main-only production environment.
    environment: production
    if: >-
      vars.CANONICAL_GITHUB_REPOSITORY != '' && vars.CANONICAL_GITHUB_REPOSITORY_ID != '' &&
      github.repository == vars.CANONICAL_GITHUB_REPOSITORY && github.repository_id == vars.CANONICAL_GITHUB_REPOSITORY_ID &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22.23.5"
      - name: Verify the report relay
        env:
          CMS_BUG_REPORT_TELEGRAM_BOT_ID: ${{ vars.CMS_BUG_REPORT_TELEGRAM_BOT_ID }}
          CMS_BUG_REPORT_TELEGRAM_BOT_USERNAME: ${{ vars.CMS_BUG_REPORT_TELEGRAM_BOT_USERNAME }}
          CMS_BUG_REPORT_TELEGRAM_BOT_TOKEN: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_BOT_TOKEN }}
          CMS_BUG_REPORT_TELEGRAM_CHAT_ID: ${{ secrets.CMS_BUG_REPORT_TELEGRAM_CHAT_ID }}
        run: node .github/scripts/report-relay.mjs
