<!doctype html>
<html lang="en" data-cms-theme="editorial">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <title>Admin design gallery</title>
    <style>
      /*
        Gallery chrome only. Every rule is namespaced under .gx and lives here rather than
        in src/, so it cannot reach the admin build or restyle the surfaces on display --
        the whole point is to see the admin exactly as it renders.

        The chrome is deliberately dull and dark: the admin surfaces are light, so they read
        as specimens on a table rather than as part of a design. If you ever can't tell where
        the gallery ends and the admin begins, this stylesheet has failed.

        The namespace only runs one way. It keeps the chrome out of the admin, but nothing
        keeps the admin out of the chrome: src/styles.css styles bare h1/h2/h3, and a rule
        that matches an element beats a color inherited from an ancestor, however weak the
        rule. So .gx hands its ink down to plain text but cannot reach a heading: an h1 in
        here that does not name a color renders in the admin's near-black, on a near-black
        background. Every heading in the chrome names its own color.

        Do not fold that into `.gx h1` -- .gx wraps the frames too, so it would light up the
        headings inside .gx-frame__body, which are the real admin on white and must keep the
        admin's ink. That is the same failure pointed at the specimens.
      */
      .gx {
        --gx-ink: #e8ecf5;
        --gx-dim: #939cb4;
        --gx-bg: #14161d;
        --gx-line: #2c3040;
        background: var(--gx-bg);
        color: var(--gx-ink);
        font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
        min-height: 100vh;
        padding: 2rem 1.5rem 6rem;
      }
      .gx-head {
        max-width: 60rem;
        margin: 0 auto 2.5rem;
      }
      .gx-head h1 {
        color: var(--gx-ink);
        font-size: 1.5rem;
        font-weight: 600;
        margin: 0 0 0.35rem;
      }
      .gx-head > p {
        color: var(--gx-dim);
        margin: 0 0 1.25rem;
        max-width: 44rem;
      }
      .gx-index {
        display: flex;
        flex-wrap: wrap;
        gap: 0.4rem;
      }
      .gx-index button {
        background: transparent;
        color: var(--gx-dim);
        border: 1px solid var(--gx-line);
        border-radius: 999px;
        padding: 0.3rem 0.7rem;
        font: inherit;
        font-size: 0.8125rem;
        cursor: pointer;
      }
      .gx-index button:hover {
        color: var(--gx-ink);
        border-color: #454b63;
      }
      .gx-index button[aria-pressed="true"] {
        background: var(--gx-ink);
        border-color: var(--gx-ink);
        color: var(--gx-bg);
      }
      /*
        The all-states caveat (#596). A direct child of .gx rather than of .gx-head, so it is
        clear of `.gx-head > p` and does not have to out-specify it to keep its own color.
      */
      .gx-note {
        background: #332a1a;
        border: 1px solid #4a3f22;
        border-radius: 0.375rem;
        color: #d9c795;
        font-size: 0.8125rem;
        margin: 0 auto 2.5rem;
        max-width: 60rem;
        padding: 0.55rem 0.75rem;
      }
      .gx-note code {
        font-family: ui-monospace, "SF Mono", Menlo, monospace;
        font-size: 0.95em;
      }
      .gx-frame {
        max-width: 100rem;
        margin: 0 auto 3.5rem;
      }
      .gx-frame__head {
        max-width: 60rem;
        margin: 0 auto 0.75rem;
      }
      .gx-frame__head h2 {
        color: var(--gx-ink);
        font-size: 1rem;
        font-weight: 600;
        margin: 0 0 0.2rem;
      }
      .gx-frame__head p {
        color: var(--gx-dim);
        font-size: 0.875rem;
        margin: 0;
      }
      /*
        Default surfaces use the available frame width. `resize: horizontal` lets you drag a
        default frame narrower to find where a layout gives out. Named narrow specimens use
        a self-rendering iframe below, so their stated width is also a real CSS viewport and
        activates the unchanged production media queries.
      */
      .gx-frame__body {
        background: #fff;
        border-radius: 0.5rem;
        overflow: hidden auto;
        resize: horizontal;
        max-height: 90vh;
      }
      .gx-frame__body:focus-within {
        outline: 2px solid #6f7ce0;
        outline-offset: 2px;
      }
      /*
        The shadow-root host for one specimen (#596). It is a plain light-DOM block that fills
        the frame body; the specimen itself, with its own copy of the admin stylesheet, lives
        in the shadow tree the gallery script attaches here.
      */
      .gx-host {
        display: block;
      }
      .gx-embedded-specimen {
        background: #fff;
        border: 0;
        display: block;
        height: min(45rem, 90vh);
      }
    </style>
  </head>
  <body>
    <div id="gallery-root"></div>
    <script type="module" src="/src/dev/gallery.tsx"></script>
  </body>
</html>
