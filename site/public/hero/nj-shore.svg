<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">abstract New Jersey shore field</title>
  <desc id="desc">Layered teal, blue, and gold shapes designed as a quiet background image.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#06113e"/>
      <stop offset="0.52" stop-color="#0f5272"/>
      <stop offset="1" stop-color="#1a8d7d"/>
    </linearGradient>
    <radialGradient id="sun" cx="74%" cy="28%" r="40%">
      <stop offset="0" stop-color="#ffd26a" stop-opacity="0.82"/>
      <stop offset="0.38" stop-color="#37b8b0" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#06113e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16"/>
    </filter>
  </defs>
  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#sun)"/>
  <g filter="url(#blur)" opacity="0.8">
    <path d="M-80 680 C210 620 370 692 610 640 C880 582 1000 620 1260 570 C1450 532 1560 552 1680 592 L1680 1080 L-80 1080 Z" fill="#88d2c5" opacity="0.26"/>
    <path d="M-80 785 C240 728 450 802 770 738 C1040 684 1210 744 1680 650 L1680 1080 L-80 1080 Z" fill="#073052" opacity="0.74"/>
    <path d="M-80 880 C240 820 430 900 760 820 C1060 748 1320 820 1680 760 L1680 1080 L-80 1080 Z" fill="#041333" opacity="0.86"/>
    <path d="M880 116 C938 214 920 292 850 390 C800 460 812 548 884 650 C952 746 934 834 834 916" fill="none" stroke="#ffffff" stroke-width="22" stroke-linecap="round" opacity="0.16"/>
  </g>
</svg>
