    <path d="M1000 108 C1062 184 1056 258 1012 350 C968 442 1012 524 1092 632 C1168 734 1134 816 1046 900" fill="none" stroke="#f5b14c" stroke-width="12" stroke-linecap="round" opacity="0.3"/>
