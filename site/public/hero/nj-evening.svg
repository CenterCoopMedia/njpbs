<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">abstract New Jersey evening field</title>
  <desc id="desc">Layered blue, violet, and amber shapes designed as a quiet background image.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#07124a"/>
      <stop offset="0.48" stop-color="#17327d"/>
      <stop offset="1" stop-color="#1f665f"/>
    </linearGradient>
    <radialGradient id="glow" cx="68%" cy="34%" r="52%">
      <stop offset="0" stop-color="#f5b14c" stop-opacity="0.75"/>
      <stop offset="0.36" stop-color="#b85d87" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#0a145a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soften" x="-20%" y="-20%" width="140%" height="140%">
